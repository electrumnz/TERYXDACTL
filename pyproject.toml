[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teryx"
version = "0.1.0"
description = "Teryx OS: dash software and test bench for an EV Kawasaki Teryx"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "python-can>=4.3",
    "aiohttp>=3.9",
    "pyyaml>=6",
    "pyserial>=3.5",   # USB CAN adaptors (the Teryx sniffer) via python-can's slcan driver
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]
pad = ["evdev>=1.6"]   # Bluetooth gamepad paired to the Pi for RC (teryx/rc_pad.py). BSD licence

[project.scripts]
teryx = "teryx.__main__:main"

[tool.setuptools.packages.find]
include = ["teryx*"]

[tool.setuptools.package-data]
teryx = ["web/**/*", "canbus/*.dbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::RuntimeWarning"]
