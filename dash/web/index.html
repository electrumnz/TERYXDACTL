<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070504">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teryx">
  <link rel="apple-touch-icon" href="img/dino/badge.webp">
  <title>Teryx Dash</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dash.css">
  <link rel="stylesheet" href="css/dino.css">
  <link rel="stylesheet" href="css/drive-looks.css">
  <link rel="stylesheet" href="css/fun.css">
  <style>
    /* Splash: inline so it shows on the very first paint, before anything else loads.
       Full-screen art (img/dino/boot.webp, made on Higgsfield) with a thin bar and the step underneath.
       It stays up for at least 5 s (BOOT_MIN_MS) so it can be seen, even when the start is quick. */
    html, body { background: #070504; }
    #splash { position: fixed; inset: 0; z-index: 100; background: #070504; overflow: hidden; transition: opacity .5s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .sp-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 0 40%; animation: spIn 5.5s ease-out both; }
    #splash .sp-foot { position: absolute; left: 0; right: 0; bottom: max(6vh, 18px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #splash .sp-bar { width: min(34vw, 420px); height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
    #splash .sp-bar div { width: 30%; height: 100%; background: #ff7a1a; box-shadow: 0 0 14px #ff7a1a; animation: sp 1.1s ease-in-out infinite; }
    #splash .sp-msg { color: #d9c9b0; font: 700 clamp(13px, 2.2vw, 20px)/1 "Barlow Condensed", "DejaVu Sans", sans-serif; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 1px 6px #000; }
    #splash .sp-err { max-width: 80vw; color: #ffb27a; font: 500 13px/1.3 sans-serif; text-align: center; }
    #splash.failed .sp-bar div { animation: none; width: 100%; background: #e5402a; box-shadow: none; }
    @keyframes spIn { 0% { opacity: 0; transform: scale(1.08); } 20% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
    /* Phones in portrait: the dash is landscape only, so ask to turn the phone. */
    #rotate { display: none; }
    @media (orientation: portrait) and (max-width: 820px) {
      #rotate { display: grid; position: fixed; inset: 0; z-index: 200; place-items: center; background: #070504; color: #f4eadb; text-align: center; font: 700 22px/1.3 "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 24px; }
      #rotate b { display: block; font-size: 64px; color: #ff7a1a; transform: rotate(90deg); margin-bottom: 16px; }
    }
    @keyframes sp { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  </style>
</head>
<body class="look-std theme-night">
  <div id="rotate" aria-hidden="true"><div><b>&#8635;</b>Turn your phone sideways</div></div>
  <div id="splash" aria-label="Starting">
    <img class="sp-art" src="img/dino/boot.webp" alt="">
    <div class="sp-foot">
      <div class="sp-bar"><div></div></div>
      <div class="sp-msg" id="splash-msg">Starting</div>
    </div>
  </div>
  <script>
    // Boot guard (plain script, runs even if the app code fails to load).
    // Keeps the splash up for BOOT_MIN_MS, and if the app hasn't started after 15 s it says why
    // and lets you tap to reload, instead of sitting on "Starting" for ever.
    (function () {
      var BOOT_MIN_MS = 5000, t0 = Date.now(), why = "";
      window.TeryxBoot = {
        started: false,
        hide: function () {
          var sp = document.getElementById("splash"); if (!sp || sp.classList.contains("gone")) return;
          setTimeout(function () { sp.classList.add("gone"); setTimeout(function () { sp.remove(); }, 600); }, Math.max(0, BOOT_MIN_MS - (Date.now() - t0)));
        }
      };
      addEventListener("error", function (e) { if (!why) why = e.message || ("Couldn't load " + ((e.target && (e.target.src || e.target.href)) || "a file")); }, true);
      addEventListener("unhandledrejection", function (e) { if (!why) why = String(e.reason && e.reason.message || e.reason); });
      setTimeout(function () {
        if (TeryxBoot.started) return;
        var sp = document.getElementById("splash"); if (!sp) return;
        sp.classList.add("failed");
        document.getElementById("splash-msg").textContent = "Couldn't start. Tap to try again";
        var d = document.createElement("div"); d.className = "sp-err"; d.textContent = why || "The app files didn't load. Check the signal.";
        sp.querySelector(".sp-foot").appendChild(d);
        sp.addEventListener("click", function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); });
      }, 15000);
    })();
  </script>
  <div id="app">
    <div id="bg" aria-hidden="true"><i class="bg-std"></i><i class="bg-offroad"></i><i class="bg-night"></i></div>
    <header id="topbar">
      <div class="tb-left">
        <span class="tb-brand"><img src="img/dino/badge.webp" alt=""><b>TERY<i>X</i></b></span>
        <span id="tb-look" class="tb-look">Predator</span>
        <span id="tb-gear" class="gear-chip">N</span>
        <span id="tb-hb" class="hb-chip" hidden title="Handbrake on">(P)</span>
        <span id="tb-mode" class="tb-text">NORMAL</span>
        <span id="tb-4wd" class="tb-chip">2WD</span>
        <span id="tb-diff" class="tb-chip">DIFF 0%</span>
        <button id="tb-flash" class="tb-flash" hidden aria-label="Warning lights on: tap to cancel"></button>
        <button id="tb-media" class="tb-media" hidden aria-label="Now playing: go to Media"></button>
        <button id="tb-stream" class="tb-stream" hidden aria-label="Close the video and go back to the dash"></button>
      </div>
      <div class="tb-centre" id="tb-alert"></div>
      <div class="tb-right">
        <span id="tb-12v" class="tb-text">12.6V</span>
        <span id="tb-link" class="tb-dot" title="Control box link"></span>
        <span id="tb-wifi" class="tb-icon"></span>
        <button id="tb-vol" class="tb-btn tb-vol" aria-label="Music volume"></button>
        <button id="tb-sound" class="tb-btn" aria-label="Sound: tap to OK an alarm, or mute"></button>
        <span id="tb-clock" class="tb-text tb-clock">--:--</span>
      </div>
    </header>
    <nav id="nav"></nav>
    <main id="screens"></main>
    <div id="toast" class="toast" hidden></div>
    <div id="fault-banner" class="fault-banner" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
