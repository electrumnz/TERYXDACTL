<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Teryx Dash</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dash.css">
  <link rel="stylesheet" href="css/dino.css">
  <style>
    /* Splash: inline so it shows on the very first paint, before anything else loads. */
    html, body { background: #070504; }
    #splash { position: fixed; inset: 0; z-index: 100; background: radial-gradient(ellipse at 50% 45%, #2a160a 0, #070504 60%); display: grid; place-items: center; transition: opacity .35s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .sp-in { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    #splash img { width: min(26vw, 300px); height: auto; border-radius: 50%; }
    #splash .sp-word { color: #f4eadb; font: italic 800 min(9vw, 104px)/1 "Barlow Condensed", "DejaVu Sans Condensed", sans-serif; letter-spacing: .06em; }
    #splash .sp-word i { color: #ff7a1a; }
    #splash .sp-bar { width: min(30vw, 360px); height: 6px; background: #241a12; overflow: hidden; }
    #splash .sp-bar div { width: 30%; height: 100%; background: #ff7a1a; box-shadow: 0 0 12px #ff7a1a; animation: sp 1.1s ease-in-out infinite; }
    #splash .sp-msg { color: #b3a38d; font: 700 20px/1 "Barlow Condensed", "DejaVu Sans", sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    @keyframes sp { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  </style>
</head>
<body class="look-std theme-night">
  <div id="splash" aria-label="Starting">
    <div class="sp-in">
      <img src="img/dino/badge.webp" alt="">
      <div class="sp-word">TERY<i>X</i></div>
      <div class="sp-bar"><div></div></div>
      <div class="sp-msg" id="splash-msg">Starting</div>
    </div>
  </div>
  <div id="app">
    <div id="bg" aria-hidden="true"><i class="bg-std"></i><i class="bg-offroad"></i><i class="bg-night"></i></div>
    <header id="topbar">
      <div class="tb-left">
        <span class="tb-brand"><img src="img/dino/badge.webp" alt=""><b>TERY<i>X</i></b></span>
        <span id="tb-look" class="tb-look">Predator</span>
        <span id="tb-gear" class="gear-chip">N</span>
        <span id="tb-hb" class="hb-chip" hidden title="Handbrake on">(P)</span>
        <span id="tb-mode" class="tb-text">NORMAL</span>
        <span id="tb-4wd" class="tb-chip">2WD</span>
        <span id="tb-diff" class="tb-chip">DIFF 0%</span>
        <button id="tb-media" class="tb-media" hidden aria-label="Now playing: go to Media"></button>
      </div>
      <div class="tb-centre" id="tb-alert"></div>
      <div class="tb-right">
        <span id="tb-12v" class="tb-text">12.6V</span>
        <span id="tb-link" class="tb-dot" title="Control box link"></span>
        <span id="tb-wifi" class="tb-icon"></span>
        <button id="tb-vol" class="tb-btn tb-vol" aria-label="Music volume"></button>
        <button id="tb-sound" class="tb-btn" aria-label="Sound: tap to OK an alarm, or mute"></button>
        <span id="tb-clock" class="tb-text tb-clock">--:--</span>
      </div>
    </header>
    <nav id="nav"></nav>
    <main id="screens"></main>
    <div id="toast" class="toast" hidden></div>
    <div id="fault-banner" class="fault-banner" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
