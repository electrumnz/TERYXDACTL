<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Teryx Dash</title>
  <link rel="stylesheet" href="css/dash.css">
  <style>
    /* Splash: inline so it shows on the very first paint, before anything else loads. */
    html, body { background: #050707; }
    #splash { position: fixed; inset: 0; z-index: 100; background: #050707; display: grid; place-items: center; transition: opacity .35s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .sp-in { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    #splash svg { width: min(46vw, 560px); height: auto; }
    #splash .sp-bar { width: min(30vw, 360px); height: 6px; border-radius: 3px; background: #1c2023; overflow: hidden; }
    #splash .sp-bar div { width: 30%; height: 100%; background: #ffad1f; border-radius: 3px; animation: sp 1.1s ease-in-out infinite; }
    #splash .sp-msg { color: #8b959b; font: 700 18px/1 "Inter", "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    @keyframes sp { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  </style>
</head>
<body class="theme-night">
  <div id="splash" aria-label="Starting">
    <div class="sp-in">
      <svg viewBox="0 0 560 140" aria-hidden="true">
        <path d="M18 104 L70 36 L142 36 L172 72 L226 72 L250 104 Z" fill="none" stroke="#ffad1f" stroke-width="8" stroke-linejoin="round"/>
        <circle cx="70" cy="110" r="22" fill="#050707" stroke="#eef1f2" stroke-width="8"/>
        <circle cx="206" cy="110" r="22" fill="#050707" stroke="#eef1f2" stroke-width="8"/>
        <text x="282" y="100" fill="#eef1f2" font-family="DejaVu Sans, Inter, sans-serif" font-weight="900" font-size="72" letter-spacing="6">TERYX</text>
        <text x="286" y="128" fill="#8b959b" font-family="DejaVu Sans, Inter, sans-serif" font-weight="700" font-size="20" letter-spacing="10">ELECTRIC</text>
      </svg>
      <div class="sp-bar"><div></div></div>
      <div class="sp-msg" id="splash-msg">Starting</div>
    </div>
  </div>
  <div id="app">
    <header id="topbar">
      <div class="tb-left">
        <span id="tb-gear" class="gear-chip">N</span>
        <span id="tb-mode" class="tb-text">NORMAL</span>
        <span id="tb-4wd" class="tb-chip">2WD</span>
        <span id="tb-diff" class="tb-chip">DIFF 0%</span>
      </div>
      <div class="tb-centre" id="tb-alert"></div>
      <div class="tb-right">
        <span id="tb-12v" class="tb-text">12.6V</span>
        <span id="tb-link" class="tb-dot" title="Control box link"></span>
        <span id="tb-wifi" class="tb-icon"></span>
        <button id="tb-sound" class="tb-btn" aria-label="Sound: tap to OK an alarm, or mute"></button>
        <span id="tb-clock" class="tb-text tb-clock">--:--</span>
      </div>
    </header>
    <nav id="nav"></nav>
    <main id="screens"></main>
    <div id="toast" class="toast" hidden></div>
    <div id="fault-banner" class="fault-banner" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
