name: Android app (Teryx Remote)

# Builds the sideloadable APK for the phone that lives in the ATV (android/README.md).
# The APK is kept as a build artefact on every run. On main, the Pages workflow also
# builds one and puts it on the demo site, so the phone can download it directly.
on:
  push:
    paths: ["android/**", "dash/web/remote.html", "dash/web/remote.webmanifest", "dash/web/css/**", "dash/web/js/remote.js", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "dash/web/remote.html", "dash/web/remote.webmanifest", "dash/web/css/**", "dash/web/js/remote.js", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Signing key (only if the repo has one set up)
        env:
          KEYSTORE_B64: ${{ secrets.TERYX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/teryx.jks"
            echo "TERYX_KEYSTORE=$RUNNER_TEMP/teryx.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key set: building with the debug key"
          fi
      - name: Build the APK
        working-directory: android
        env:
          TERYX_VERSION_CODE: ${{ github.run_number }}
          TERYX_KEYSTORE_PASSWORD: ${{ secrets.TERYX_KEYSTORE_PASSWORD }}
          TERYX_KEY_ALIAS: ${{ secrets.TERYX_KEY_ALIAS }}
          TERYX_KEY_PASSWORD: ${{ secrets.TERYX_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk teryx-remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: teryx-remote-apk
          path: teryx-remote.apk
