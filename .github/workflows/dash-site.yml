name: Dash demo site

# Puts dash/web online on GitHub Pages so the dash can be opened on a phone
# with no Pi or laptop on. On *.github.io the dash runs its built-in demo vehicle.
# The wiring drawing (docs/wiring: schematic.json made from config/wiring.yaml, drawn by sld.js) goes up at /wiring/.
# The Android remote app (android/) goes up as /teryx-remote.apk, to download on the phone.
on:
  push:
    branches: [main]
    paths: ["dash/web/**", "docs/wiring/**", "android/**", ".github/workflows/dash-site.yml",
            "teryx/**", "config/**", "firmware/VERSION", "tools/build_rig_web.py"]   # the simulator page (rig/) bundles these
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as in GitHub's own Pages workflow: build and upload the site, then deploy it.
# With both in one job the deploy step twice couldn't find the upload it had just made
# ("No artifacts named github-pages"), so the old site stayed up.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Signing key (only if the repo has one set up)
        env:
          KEYSTORE_B64: ${{ secrets.TERYX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/teryx.jks"
            echo "TERYX_KEYSTORE=$RUNNER_TEMP/teryx.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the Android remote app
        working-directory: android
        env:
          TERYX_VERSION_CODE: ${{ github.run_number }}
          TERYX_KEYSTORE_PASSWORD: ${{ secrets.TERYX_KEYSTORE_PASSWORD }}
          TERYX_KEY_ALIAS: ${{ secrets.TERYX_KEY_ALIAS }}
          TERYX_KEY_PASSWORD: ${{ secrets.TERYX_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bundle the Python for the simulator page (rig/)
        run: |
          pip install pyyaml python-can
          python tools/build_rig_web.py
      - name: Put the dash and the wiring viewer together
        run: |
          mkdir -p _site
          cp -r dash/web/. _site/
          mkdir -p _site/wiring
          cp -r docs/wiring/. _site/wiring/
          # lay the wiring canvas out once here, so the page opens straight away on a phone
          node tools/wiring_sld_check.mjs --geom _site/wiring/layout.json
          cp android/app/build/outputs/apk/release/app-release.apk _site/teryx-remote.apk
      - name: Stamp the code with this build so phones never mix old and new files
        # A phone can keep some old .js files cached after a deploy. Old and new modules then don't
        # fit together and the dash sits on "Starting". Adding ?v=<commit> to every script and
        # module link makes each deploy load as one matching set.
        run: python3 tools/stamp_site.py _site "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
