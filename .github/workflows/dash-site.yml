name: Dash demo site

# Puts dash/web online on GitHub Pages so the dash can be opened on a phone
# with no Pi or laptop on. On *.github.io the dash runs its built-in demo vehicle.
# The wiring viewer (docs/wiring, made from config/wiring.yaml) goes up at /wiring/.
on:
  push:
    branches: [main]
    paths: ["dash/web/**", "docs/wiring/**", ".github/workflows/dash-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Put the dash and the wiring viewer together
        run: |
          mkdir -p _site
          cp -r dash/web/. _site/
          mkdir -p _site/wiring
          cp docs/wiring/index.html docs/wiring/*.svg _site/wiring/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
