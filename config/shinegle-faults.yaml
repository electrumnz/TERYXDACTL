- code: 9
  cn: 电机温度传感器故障
  en: Motor temperature sensor fault
  cause_cn:
  - 电机温度传感器坏
  - 电机温升过高
  - 电机温度传感器线松动
  cause:
  - Motor temp sensor broken
  - Motor running too hot
  - Motor temp sensor wire loose
  fix_cn:
  - 更换电机温度传感器
  - 使电机温升恢复正常值
  - 接好传感器线
  fix:
  - Replace the motor temp sensor
  - Let the motor cool back to normal
  - Reconnect the sensor wire
- code: 10
  cn: 预充电电压低
  en: Precharge voltage low
  cause_cn:
  - 电池预充电电压小于设定值
  - 预充电电阻故障
  cause:
  - Precharge voltage below the set value
  - Precharge resistor fault
  fix_cn:
  - 使电池电压恢复正常值
  - 更换预充电电阻
  fix:
  - Bring the battery voltage back to normal
  - Replace the precharge resistor
- code: 11
  cn: 硬件安全故障
  en: Hardware safety fault
  cause_cn:
  - 环境干扰大
  - 自检或看门狗出错
  - 控制器故障
  cause:
  - Heavy electrical noise
  - Self-test or watchdog error
  - Controller fault
  fix_cn:
  - 重新开启钥匙开关，如问题继续存在，更换控制器
  fix:
  - Cycle the key switch. If it keeps happening
  - replace the controller
- code: 12
  cn: 控制器温升故障
  en: Controller over-temperature
  cause_cn:
  - 温度过高
  - 车辆过载
  - 控制器安装错误
  cause:
  - Temperature too high
  - Vehicle overloaded
  - Controller mounted wrong
  fix_cn:
  - 使温度恢复至正常值
  fix:
  - Let the temperature come back to normal
- code: 13
  cn: 主接触器或者制动器故障
  en: Main contactor or brake fault
  cause_cn:
  - 主接触器故障
  - 制动器故障
  cause:
  - Main contactor fault
  - Brake fault
  fix_cn:
  - 更换主接触器
  - 更换制动器
  fix:
  - Replace the main contactor
  - Replace the brake
  note: 制动器 is a brake device, so the controller watches some kind of brake. Which pin is not documented. See docs/brake-regen.md.
- code: 14
  cn: 电池电压过高
  en: Battery voltage too high
  cause_cn:
  - 电池电压高于控制器最高截止工作电压
  - 电源来自电网或者发电时，制…
  cause:
  - Battery voltage above the controller's top cut-off voltage
  - Braking too hard while power is coming back (charging or regen)
  fix_cn:
  - 使电池电压低于控制器上限截止工作电压
  fix:
  - Bring the battery voltage below the controller's upper cut-off voltage
  note: Regen can push a full pack over the limit. Fix by lowering the brake rate (B_Rat) or decel rate (DecRat).
- code: 15
  cn: 电池电压过低
  en: Battery voltage too low
  cause_cn:
  - 电池电压过低
  - 突然断电
  - 接线端子松动
  cause:
  - Battery voltage too low
  - Power cut suddenly
  - Terminal loose
  fix_cn:
  - 使电池电压恢复至正常值
  fix:
  - Bring the battery voltage back to normal
- code: 16
  cn: 预充电压2过低
  en: Precharge voltage 2 too low
  cause_cn:
  - 预充电电压太低
  - 充电电路故障
  cause:
  - Precharge voltage too low
  - Charging (precharge) circuit fault
  fix_cn:
  - 检查电池电压
  - 更换控制器
  fix:
  - Check the battery voltage
  - Replace the controller
- code: 17
  cn: 电流传感器故障1
  en: Current sensor 1 fault
  cause_cn:
  - 电流传感器1故障
  - 端子松动
  cause:
  - Current sensor 1 fault
  - Terminal loose
  fix_cn:
  - 更换电流传感器
  - 拧紧端子
  fix:
  - Replace the current sensor
  - Tighten the terminal
- code: 18
  cn: 电流传感器故障2
  en: Current sensor 2 fault
  cause_cn:
  - 电流传感器2故障
  - 端子松动
  cause:
  - Current sensor 2 fault
  - Terminal loose
  fix_cn:
  - 更换电流传感器
  - 拧紧端子
  fix:
