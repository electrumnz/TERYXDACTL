  - Tighten the terminal
- code: 19
  cn: 电池电压高
  en: Battery voltage high
  cause_cn:
  - 电池电压高于控制器设定工作电压
  - 电压控制器制动过快
  cause:
  - Battery voltage above the controller's set working voltage
  - Controller braking too fast
  fix_cn:
  - 使电池电压低于控制器设定工作电压
  - 减小减速速率或者延长减速时间
  fix:
  - Bring the battery voltage below the controller's set working voltage
  - Lower the deceleration rate or make the deceleration time longer
  note: Lower DecRat (page 4, adjustable 3-36).
