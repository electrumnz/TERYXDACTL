# Shinegle controller fault codes (附表2 SHINEGLE 控制器故障代码列表及原因分析), our copy.
# From the SG1810 programmer manual, screenshots from Sam, 2026-11-18. The code
# is both the LED flash count and the ErrorCode the programmer shows.
# The Chinese is the source; the English is our own, corrected translation
# (Shinegle's English had errors). Obvious typos in the Chinese are fixed.
# A cell that ran off the page in the manual ends in "…".
#
# Fields: code (int or "lo-hi"), cn / en, cause_cn / cause, fix_cn / fix, note.

faults:
- code: 1
  cn: 正常
  en: Normal
  cause_cn:
  - 无
  cause:
  - None
  fix_cn:
  - 无
  fix:
  - None
  note: The status screen shows ErrorCode 0 when there is no fault.
- code: 2
  cn: 电池电压低
  en: Battery voltage low
  cause_cn:
  - 电池电压小于控制器最低工作电压
  - 电池端子腐蚀
  - 电池或控制器接线端子松动
  cause:
  - Battery voltage below the controller's minimum working voltage
  - Battery terminal corrosion
  - Battery or controller terminal loose
  fix_cn:
  - 使电池电压高于控制器最低工作电压
  fix:
  - Bring the battery voltage above the controller's minimum working voltage
- code: 3
  cn: U相电流传感器故障
  en: Phase U current sensor fault
  cause_cn:
  - 车辆操作错误导致高电流尖锋
  - 电流传感器超范围
  - 控制器故障
  cause:
  - Wrong vehicle operation caused a high current spike
  - Current sensor out of range
  - Controller fault
  fix_cn:
  - 重新开启钥匙开关，如问题继续存在，更换控制器
  fix:
  - Cycle the key switch. If it keeps happening
  - replace the controller
- code: 4
  cn: V相电流传感器故障
  en: Phase V current sensor fault
  cause_cn:
  - 车辆操作错误导致高电流尖锋
  - 电流传感器超范围
  - 控制器故障
  cause:
  - Wrong vehicle operation caused a high current spike
  - Current sensor out of range
  - Controller fault
  fix_cn:
  - 重新开启钥匙开关，如问题继续存在，更换控制器
  fix:
  - Cycle the key switch. If it keeps happening
  - replace the controller
- code: 5
  cn: 系统错误
  en: System error
  cause_cn:
  - 环境干扰大
  - 过载
  cause:
  - Heavy electrical noise
  - Overload
  fix_cn:
  - 重新开启钥匙开关，如问题继续存在，更换控制器
  fix:
  - Cycle the key switch. If it keeps happening
  - replace the controller
- code: 6
  cn: U 相故障
  en: Phase U fault
  cause_cn:
  - 环境干扰大
  - 死区时间设置不当
  - 控制器故障
  cause:
  - Heavy electrical noise
  - Dead time set wrong
  - Controller fault
  fix_cn:
  - 减少环境干扰
  - 调整死区时间
  - 如问题继续存在，更换控制器
  fix:
  - Reduce the noise
  - Adjust the dead time
  - If it keeps happening
  - replace the controller
- code: 7
  cn: V 相故障
  en: Phase V fault
  cause_cn:
  - 环境干扰大
  - 死区时间设置不当
  - 控制器故障
  cause:
  - Heavy electrical noise
  - Dead time set wrong
  - Controller fault
  fix_cn:
  - 减少环境干扰
  - 调整死区时间
  - 如问题继续存在，更换控制器
  fix:
  - Reduce the noise
  - Adjust the dead time
  - If it keeps happening
  - replace the controller
- code: 8
  cn: W 相故障
  en: Phase W fault
  cause_cn:
  - 环境干扰大
  - 死区时间设置不当
  - 控制器故障
  cause:
  - Heavy electrical noise
  - Dead time set wrong
