- code: 24
  cn: 系统负载故障1
  en: System load fault 1
  cause_cn:
  - 电机缺相
  - 接口松动
  - 电机相序接反
  - 环境干扰
  cause:
  - Motor missing a phase
  - Plug loose
  - Motor phases in the wrong order
  - Electrical noise
  fix_cn:
  - 检查电机UVW相
  - 拧紧接口
  - 对调UW相
  - 消除干扰源
  fix:
  - Check motor phases U V W
  - Tighten the plug
  - Swap U and W
  - Remove the noise source
