# --------------------------------------------------------------------------
# Wires. One line each: id, from, to, sheet (sys), size, fuse, status, note.
# `fuse` is the fuse that protects this wire, if it isn't on the `from` pin.
# Status left out = the lower of the two devices' statuses.
wires:
  # --- traction (72 V). Cable sizes not in any manual we have.
  - {id: H01, from: PACK.pos, to: HV_ISO.in, sys: hv, status: from_manual, note: "Main pack + to the air-break switch. Size TBC, check for a main HV fuse"}
  - {id: H02, from: HV_ISO.out, to: CONTACTOR.in, sys: hv, status: tbc}
  - {id: H03, from: CONTACTOR.out, to: SG1202.B+, sys: hv, status: tbc}
  - {id: H04, from: PACK.neg, to: SG1202.B-, sys: hv, status: from_manual}
  - {id: H05, from: SG1202.U, to: MOTOR.U, sys: hv, status: from_manual}
  - {id: H06, from: SG1202.V, to: MOTOR.V, sys: hv, status: from_manual}
  - {id: H07, from: SG1202.W, to: MOTOR.W, sys: hv, status: from_manual}
  - {id: H08, from: CONTACTOR.out, to: DCDC.in_pos, sys: hv, status: tbc, note: "Where the DC-DC takes its 72 V from is TBC"}
  - {id: H09, from: PACK.neg, to: DCDC.in_neg, sys: hv, status: tbc}

  # --- Shinegle low voltage
  - {id: S01, from: KIT_KEY.out, to: ESTOP.in, sys: sg, status: planned, optional: true, note: "Without the e-stop, KIT_KEY goes straight to the lock relay or J1-1"}
  - {id: S02, from: ESTOP.out, to: RELAYS2.COM2, sys: sg, status: planned, optional: true}
  - {id: S03, from: RELAYS2.NC2, to: SG1202.J1-1, sys: sg, fuse: 10, mm2: 1.0, status: planned, note: "KSI through 10 A fuse (manual). NC contact so a dead control box never strands you"}
  - {id: S04, from: KIT_KEY.out, to: FNR.COM, sys: sg, status: from_manual, note: "Manual feeds the direction switch from the key"}
  - {id: S05, from: FNR.F, to: SG1202.J1-22, sys: sg, status: from_manual}
  - {id: S06, from: FNR.R, to: SG1202.J1-33, sys: sg, status: from_manual}
  - {id: S07, from: SG1202.J1-25, to: THROTTLE.V12, sys: sg, status: from_manual}
  - {id: S08, from: THROTTLE.WIPER, to: SG1202.J1-16, sys: sg, status: from_manual}
  - {id: S09, from: THROTTLE.GND, to: SG1202.J1-18, sys: sg, status: from_manual}
  - {id: S10, from: THROTTLE.SW, to: SG1202.J1-9, sys: sg, status: from_manual}
  - {id: S11, from: SG1202.J1-25, to: MOTOR.SPD_12V, sys: sg, status: from_manual, note: "Speed sensor plugs J6/J7"}
  - {id: S12, from: MOTOR.SPD_A, to: SG1202.J1-31, sys: sg, status: from_manual}
  - {id: S13, from: MOTOR.SPD_B, to: SG1202.J1-32, sys: sg, status: from_manual}
  - {id: S14, from: MOTOR.SPD_GND, to: SG1202.J1-7, sys: sg, status: from_manual}
  - {id: S15, from: MOTOR.TEMP1, to: SG1202.J1-8, sys: sg, status: from_manual, note: "Motor temp plugs J8/J9"}
  - {id: S16, from: MOTOR.TEMP2, to: SG1202.J1-7, sys: sg, status: from_manual}
  - {id: S17, from: SG1202.J1-6, to: SPEEDO.SPD, sys: sg, status: from_manual, optional: true, note: "Speed pulse. Could also feed the Pico if CAN isn't fitted"}
  - {id: S18, from: SG1202.J3, to: PROG.PLUG, sys: sg, status: tbc, optional: true, note: "Setup only. J3 to J1-25/28/29/7 TBC"}

  # --- 12 V power
  - {id: P01, from: BAT12.pos, to: FB.IN, sys: power, mm2: 10, fuse: 60, status: planned, note: "60 A main fuse at the battery. Was 6 mm² in wiring.md, which the table only rates to 40 A"}
  - {id: P02, from: FB.F16, to: KEY.BAT, sys: power, mm2: 1.0, status: planned}
  - {id: P03, from: KEY.IGN, to: RAIL.BUS, sys: power, mm2: 1.0, fuse: 7.5, status: planned}
  - {id: P04, from: FB.F12, to: RELAYS.COM8, sys: power, mm2: 1.0, status: planned}
  - {id: P05, from: RELAYS.NO8, to: RAIL.BUS, sys: power, mm2: 1.0, fuse: 7.5, status: planned, note: "Power hold, in parallel with the key"}
  - {id: P06, from: RAIL.BUS, to: TVS.K, sys: power, mm2: 1.0, status: planned}
  - {id: P07, from: RAIL.BUS, to: PI_BUCK.VIN, sys: power, mm2: 1.5, status: planned}
  - {id: P08, from: RAIL.BUS, to: PICO_BUCK.VIN, sys: power, mm2: 0.75, fuse: 2, status: planned, note: "2 A inline fuse"}
  - {id: P09, from: PI_BUCK.VOUT, to: PI5.5V, sys: power, mm2: 1.5, status: planned, note: "Short and thick, under 30 cm. Set usb_max_current_enable=1"}
  - {id: P10, from: PICO_BUCK.VOUT, to: PICO.VSYS, sys: power, mm2: 0.5, status: planned}
  - {id: P11, from: PICO_BUCK.VOUT, to: RELAYS.JDVCC, sys: power, mm2: 0.5, status: planned, note: "Relay coils, about 0.6 A for 8"}
  - {id: P12, from: PICO_BUCK.VOUT, to: RELAYS2.JDVCC, sys: power, mm2: 0.5, status: planned, optional: true}
  - {id: P13, from: RAIL.BUS, to: SCREEN_PSU.VIN, sys: power, mm2: 1.0, fuse: 3, status: tbc, note: "Fuse size depends on the screen's draw"}
  - {id: P14, from: SCREEN_PSU.VOUT, to: SCREEN.DC_IN, sys: power, mm2: 1.0, status: tbc}
  - {id: P15, from: FB.F11, to: RELAYS.COM7, sys: power, mm2: 1.5, status: planned, note: "Accessory 12 V, on with ignition"}
  - {id: P16, from: BAT12.pos, to: AMP.B+, sys: power, mm2: 4.0, fuse: 30, status: planned, optional: true, note: "Own fuse at the battery. 4 x 50 W can pull 20-30 A"}
  - {id: P17, from: RAIL.BUS, to: AMP.REM, sys: power, mm2: 0.5, fuse: 2, status: planned, optional: true, note: "Remote turn-on, goes off with the rail"}
  - {id: P18, from: DCDC.out_pos, to: BAT12.pos, sys: power, status: tbc, note: "DC-DC charge lead. Size and fuse depend on its rating"}
  - {id: P19, from: BAT12.pos, to: EPS_ECU.B+, sys: power, mm2: 10, fuse: 60, status: planned, optional: true, note: "Own 60 A fuse and cable straight to the battery (Toyota fuses the Prius EPS at 60 A)"}

  # --- grounds
  - {id: G01, from: BAT12.neg, to: GND_STAR.G, sys: ground, mm2: 10, status: planned, note: "Same size as the main feed"}
  - {id: G02, from: DCDC.out_neg, to: GND_STAR.G, sys: ground, status: tbc}
  - {id: G03, from: TVS.A, to: GND_STAR.G, sys: ground, mm2: 1.0, status: planned}
  - {id: G04, from: PI_BUCK.GND, to: GND_STAR.G, sys: ground, mm2: 1.5, status: planned}
  - {id: G05, from: PI5.GND, to: PI_BUCK.GND, sys: ground, mm2: 1.5, status: planned}
  - {id: G06, from: PICO_BUCK.GND, to: GND_STAR.G, sys: ground, mm2: 0.75, status: planned}
  - {id: G07, from: PICO.GND, to: PICO_BUCK.GND, sys: ground, mm2: 0.5, status: planned, note: "All control box boards share the Pico ground"}
  - {id: G08, from: SCREEN_PSU.GND, to: GND_STAR.G, sys: ground, mm2: 1.0, status: tbc}
  - {id: G09, from: SCREEN.GND, to: SCREEN_PSU.GND, sys: ground, mm2: 1.0, status: tbc}
  - {id: G10, from: AMP.GND, to: GND_STAR.G, sys: ground, mm2: 4.0, status: planned, optional: true}
  - {id: G11, from: MOSFET.GND, to: GND_STAR.G, sys: ground, mm2: 2.5, status: planned, note: "Carries all five lights' current"}
  - {id: G12, from: BTS1.B-, to: GND_STAR.G, sys: ground, mm2: 1.5, status: planned}
  - {id: G13, from: BTS2.B-, to: GND_STAR.G, sys: ground, mm2: 1.5, status: planned}
  - {id: G14, from: BTS3.B-, to: GND_STAR.G, sys: ground, mm2: 2.5, status: planned}
  - {id: G15, from: FLOOD_L.neg, to: GND_STAR.G, sys: ground, mm2: 1.5, status: planned}
  - {id: G16, from: FLOOD_R.neg, to: GND_STAR.G, sys: ground, mm2: 1.5, status: planned}
  - {id: G17, from: WINCH_SOL.GND, to: BAT12.neg, sys: ground, mm2: 35, status: planned, rating_from: maker, note: "Winch return straight to the battery, cable from the winch kit"}
  - {id: G18, from: WINCH_ISO.coil_neg, to: GND_STAR.G, sys: ground, mm2: 0.5, status: planned}
  - {id: G19, from: OPTO.COM12, to: GND_STAR.G, sys: ground, mm2: 0.5, status: planned, note: "12 V side ground of the opto board"}
  - {id: G20, from: TRAILER.P3_EARTH, to: GND_STAR.G, sys: ground, mm2: 2.5, status: planned}
  - {id: G21, from: TCAM_PLUG.GND, to: GND_STAR.G, sys: ground, mm2: 0.5, status: planned, optional: true}
  - {id: G22, from: EPS_ECU.GND, to: BAT12.neg, sys: ground, mm2: 10, status: planned, optional: true}
  - {id: G23, from: CAM_TRAILER.GND, to: TCAM_PLUG.GND, sys: ground, mm2: 0.5, status: planned, optional: true, note: "Earth the camera at the hitch, not through the 7-pin earth"}

  # --- CAN
  - {id: C01, from: SG1202.CAN_H, to: PICO_CAN.CANH, sys: can, bus: main, mm2: 0.5, status: tbc, note: "Twisted pair. CAN is optional on the SG1202, check it's fitted. Bit rate TBC (try 250k then 500k)"}
  - {id: C02, from: SG1202.CAN_L, to: PICO_CAN.CANL, sys: can, bus: main, mm2: 0.5, status: tbc}
  - {id: C03, from: PICO_CAN.CANH, to: PI_CAN.CANH, sys: can, bus: main, mm2: 0.5, status: planned, note: "120 ohm at the Shinegle end and the Pi end. 60 ohm H to L with all off"}
  - {id: C04, from: PICO_CAN.CANL, to: PI_CAN.CANL, sys: can, bus: main, mm2: 0.5, status: planned}
  - {id: C05, from: EPS_CAN.CANH, to: EPS_ECU.CANH, sys: can, bus: steering, mm2: 0.5, status: planned, optional: true, note: "Own bus, 500 kbit/s, Toyota frames 0x0B4 and 0x2C4"}
  - {id: C06, from: EPS_CAN.CANL, to: EPS_ECU.CANL, sys: can, bus: steering, mm2: 0.5, status: planned, optional: true}

  # --- control box logic (Pico side)
  - {id: L01, from: PICO.GP2, to: PICO_CAN.SCK, sys: logic, status: planned, note: "SPI under 10 cm"}
  - {id: L02, from: PICO.GP3, to: PICO_CAN.SI, sys: logic, status: planned}
  - {id: L03, from: PICO.GP4, to: PICO_CAN.SO, sys: logic, status: planned}
  - {id: L04, from: PICO.GP5, to: PICO_CAN.CS, sys: logic, status: planned}
  - {id: L05, from: PICO_CAN.INT, to: PICO.GP6, sys: logic, status: planned}
  - {id: L06, from: PICO.GP2, to: EPS_CAN.SCK, sys: logic, status: planned, optional: true}
  - {id: L07, from: PICO.GP3, to: EPS_CAN.SI, sys: logic, status: planned, optional: true}
  - {id: L08, from: PICO.GP4, to: EPS_CAN.SO, sys: logic, status: planned, optional: true}
  - {id: L09, from: PICO.GP22, to: EPS_CAN.CS, sys: logic, status: planned, optional: true, note: "GP22 freed from ADS1115 ALERT"}
  - {id: L10, from: PICO.GP26, to: MCP1.SDA, sys: logic, status: planned, note: "4.7k pull-ups to 3.3 V, once for the whole bus"}
  - {id: L11, from: PICO.GP27, to: MCP1.SCL, sys: logic, status: planned}
  - {id: L12, from: PICO.GP26, to: ADS1.SDA, sys: logic, status: planned}
  - {id: L13, from: PICO.GP27, to: ADS1.SCL, sys: logic, status: planned}
  - {id: L14, from: PICO.GP26, to: MCP2.SDA, sys: logic, status: planned, optional: true}
  - {id: L15, from: PICO.GP27, to: MCP2.SCL, sys: logic, status: planned, optional: true}
  - {id: L16, from: PICO.GP26, to: ADS2.SDA, sys: logic, status: planned, optional: true}
  - {id: L17, from: PICO.GP27, to: ADS2.SCL, sys: logic, status: planned, optional: true}
  - {id: L18, from: MCP1.INTB, to: PICO.GP21, sys: logic, status: planned}
  - {id: L19, from: MCP1.A0, to: RELAYS.IN1, sys: logic, status: planned, note: "light.rear"}
  - {id: L20, from: MCP1.A1, to: RELAYS.IN2, sys: logic, status: planned, note: "trailer.tail"}
  - {id: L21, from: MCP1.A2, to: RELAYS.IN3, sys: logic, status: planned, note: "trailer.brake"}
  - {id: L22, from: MCP1.A3, to: RELAYS.IN4, sys: logic, status: planned, note: "winch.in"}
  - {id: L23, from: MCP1.A4, to: RELAYS.IN5, sys: logic, status: planned, note: "winch.out"}
  - {id: L24, from: MCP1.A5, to: RELAYS.IN6, sys: logic, status: planned, note: "winch.isolator"}
  - {id: L25, from: MCP1.A6, to: RELAYS.IN7, sys: logic, status: planned, note: "aux.accessory"}
  - {id: L26, from: MCP1.A7, to: RELAYS.IN8, sys: logic, status: planned, note: "power.hold"}
  - {id: L27, from: MCP2.A0, to: RELAYS2.IN1, sys: logic, status: planned, optional: true, note: "steering enable"}
  - {id: L28, from: MCP2.A1, to: RELAYS2.IN2, sys: logic, status: planned, optional: true, note: "drive lock (opens the KSI line while locked and parked)"}
  - {id: L29, from: OPTO.OUT1, to: MCP1.B0, sys: logic, status: planned, note: "in.ignition"}
  - {id: L30, from: OPTO.OUT2, to: MCP1.B1, sys: logic, status: planned, note: "in.brake"}
  - {id: L31, from: OPTO.OUT3, to: MCP1.B2, sys: logic, status: planned, note: "in.reverse"}
