  - {id: L35, from: OPTO.OUT7, to: MCP1.B6, sys: logic, status: planned, note: "in.park"}
  - {id: L36, from: OPTO.OUT8, to: MCP1.B7, sys: logic, status: planned, note: "in.trailer"}
  - {id: L37, from: PICO.3V3, to: MCP1.VDD, sys: logic, status: planned}
  - {id: L38, from: PICO.3V3, to: ADS1.VDD, sys: logic, status: planned}
  - {id: L39, from: PICO.3V3, to: PICO_CAN.VCC, sys: logic, status: planned}
  - {id: L40, from: PICO.3V3, to: RELAYS.VCC, sys: logic, status: planned}
