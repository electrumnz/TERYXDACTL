  # --- 12 V signals in
  - {id: I01, from: KEY.IGN, to: OPTO.IN1, sys: inputs, mm2: 0.75, fuse: 7.5, via: "1 A diode", status: planned, note: "So the Pico sees key-off while relay 8 holds the rail. 0.75 mm² because the 7.5 A key fuse is upstream"}
  - {id: I02, from: BRAKE_SW.OUT, to: OPTO.IN2, sys: inputs, mm2: 0.5, status: tbc}
  - {id: I03, from: FNR.R, to: OPTO.IN3, sys: inputs, mm2: 0.5, via: "opto board", status: tbc, note: "The F-N-R switch is on the Shinegle key line. If J1-1 runs at 72 V, this needs a 72 V rated input, not the 12 V opto"}
