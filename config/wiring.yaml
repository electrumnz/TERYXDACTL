    pins: {M+: 12v, M-: 12v}
  ACT_TRAY:
    name: Tray lift actuator (400 mm)
    zone: rear
    status: confirmed
    pins: {M+: 12v, M-: 12v}
  LIM_DN: {name: Tray down limit (NC), zone: rear, status: planned, pins: {C: {v: 12v, multi: true}, NC: 12v}}
  LIM_UP: {name: Tray up limit (NC), zone: rear, status: planned, pins: {C: {v: 12v, multi: true}, NC: 12v}}
  BRAKE_SW:
    name: Brake light switch (stock)
    zone: cab
    status: tbc
    note: "Also feeds both brake filaments and the trailer stop pin through diodes, so the brake lights work at full even with the control box off"
    check: Find the brake light switch wire and meter it (12 V when pressed?)
    pins: {OUT: {v: 12v, multi: true}}
  PARK_SW:
    name: Parking brake switch (stock)
    zone: cab
    status: tbc
    note: Lights the red parking brake light in the meter
    check: Find the parking brake switch wire at the meter plug. Does it switch ground or 12 V?
    pins: {OUT: 12v}
  BRAKE_PEDAL:
    name: Brake pedal Hall sensor
    zone: cab
    status: planned
    optional: true
    note: Brake regen only, once the Shinegle check passes
    doc: docs/brake-regen.md
    pins: {V5: 5v, SIG: 5v, GND: gnd}
  BRAKE_PRESS:
    name: Brake line pressure sensor
    zone: front
    status: planned
    optional: true
    note: Optional cross-check for the pedal sensor, 0.5-4.5 V
    doc: docs/brake-regen.md
    pins: {V5: 5v, SIG: 5v, GND: gnd}
  EPS_ECU:
    name: Toyota Aqua EPS ECU (89650-52B51)
    zone: cab
    status: tbc
    optional: true
    note: Wrecker column, bench test with the Prius CAN frames first. ECU plug pinout TBC
    check: Photo both EPS ECU plugs (pin numbers and wire colours) when the column is picked up
    doc: docs/power-steering-wrecker.md
    pins: {B+: 12v, GND: gnd, IG: 12v, CANH: {v: can, term: true}, CANL: can, MOTOR: 12v}
  EPS_COL:
    name: Aqua steering column (motor + torque sensor)
    zone: cab
    status: tbc
    optional: true
    note: Motor and torque sensor plugs go to the ECU on Toyota's own loom
    check: Measure the space from the steering wheel to where the Teryx shaft goes to the rack
    pins: {MOTOR: 12v}

  # ---------------------------------------------------------- trailer
  TRAILER:
    name: 7-pin flat trailer socket (Narva 82043BL, reed switch)
    zone: rear
    status: planned
    doc: docs/cameras.md
    check: Which way does the Narva reed switch switch, and what triggers it?
    pins: {P1_LEFT: 12v, P2_REV: 12v, P3_EARTH: gnd, P4_RIGHT: 12v, P5_BRAKES: 12v, P6_STOP: {v: 12v, multi: true}, P7_TAIL: 12v, REED_A: 12v, REED_B: 12v}
  TCAM_PLUG:
    name: Trailer EU 7-pin round plug (camera + light bar, Sam's)
    zone: rear
    status: planned
    optional: true
    note: "Sam's EU round 7-pin, next to the flat NZ/AU 7-pin for the main trailer lights, so they can't be mixed up. NOT wired to the EU light standard. 1 cam +12 V, 2 video, 3 cam ground, 4 video shield, 5 light bar +12 V, 6 light bar - (switched), 7 spare. Light bar on 1.5 mm² (pins are good for 10 A+). Spring cap on the socket and dielectric grease on the pins"
    pins: {V12: {v: 12v, multi: true}, GND: gnd, VID: {v: video, multi: true}, VID_GND: {v: video, multi: true}, LB_POS: {v: 12v, multi: true}, LB_NEG: {v: 12v, multi: true}}
  CAM_TRAILER:
    name: Trailer camera (12 V AHD)
    zone: trailer
    status: planned
    optional: true
    pins: {V12: 12v, GND: gnd, VID: video, VID_GND: video}
  TCAM_DONGLE:
    name: Analogue video to camera-ribbon (CSI) board, ADV7280-M (rear + trailer)
    zone: dash
    status: tbc
    note: "No USB (Sam). The cameras run in CVBS (PAL) mode into this board, which sits in the Pi box on the Pi's 2nd camera ribbon port. ADV7280-M has several analogue inputs picked in software (adv728x-m overlay, adv7180 driver), so it swaps rear/trailer itself, no relay. A spare input can take a small cabin camera later. Pi 5 support for these boards is not proven yet: bench test it first"
    check: "Confirm the board works on the Pi 5 (dtoverlay=adv728x-m,adv7280m=1); set each AHD camera to CVBS/PAL (OSD menu or mode wire)"
    pins: {VID: video, VID_GND: video, VID_R: video, VID_R_GND: video, CSI: csi}

  # ---------------------------------------------------------- dash computer
  PI5:
    name: Raspberry Pi 5 8GB
    zone: dash
    status: confirmed
    note: The 40-pin header and the PCIe port are kept for the AI HAT+ 2. CAN module wires go to header pins that come up through the HAT
    doc: docs/wiring.md
    pins:
      5V: 5v
      GND: gnd
      HDMI0: hdmi
      HDMI1: hdmi
      USB3_A: usb
      USB3_B: usb
      USB2_A: usb
      USB2_B: usb
      CSI0: csi
      CSI1: csi
      PCIE: pcie
      HAT_HDR: {v: 3v3, desc: 40-pin header to the 16 mm stacking header}
      P1_3V3: 3v3
      P2_5V: 5v
      P3_SDA: {v: 3v3, multi: true}
      P5_SCL: {v: 3v3, multi: true}
      P8_TXD: 3v3
      P10_RXD: 3v3
      P12_GPIO18: 3v3
      P35_GPIO19: 3v3
      P40_GPIO21: 3v3
      P19_MOSI: 3v3
      P21_MISO: 3v3
      P22_GPIO25: 3v3
      P23_SCLK: 3v3
      P24_CE0: 3v3
  AIHAT:
    name: AI HAT+ 2 (later)
    zone: dash
    status: placeholder
    optional: true
    note: Not buying yet. Room, cooling (about 4.5 W) and the PCIe port stay free for it
    doc: docs/ai-hat-ideas.md
    pins: {PCIE: pcie, HDR: 3v3}
  PI_CAN:
    name: MCP2515 CAN module (Pi)
    zone: dash
    status: planned
    note: Seeed MCP2515 + SN65HVD230 on the Pi box wall
    pins: {VCC: 3v3, GND: gnd, SCK: 3v3, SI: 3v3, SO: 3v3, CS: 3v3, INT: 3v3, CANH: {v: can, term: true}, CANL: can}
  SCREEN:
    name: 10.1 in touch screen
    zone: dash
    status: confirmed
    note: 1280x800, HDMI + USB touch, 3.5 mm audio in
    pins: {HDMI: hdmi, USB: usb, DC_IN: 12v, GND: gnd, AUDIO_IN: audio}
  GLOVE_USB:
    name: Glove box USB-C charger (RC phone)
    zone: dash
    status: planned
    optional: true
    note: 12 V to USB-C PD socket for the phone that lives in the glove box (docs/rc-beach-launch.md 4b). Fed from the accessory relay so it's off with the key off
    check: Pick a 12 V USB-C PD panel socket (waterproof cap, about 20-30 W)
    pins: {VIN: 12v, GND: gnd, USBC: usb}
  CAM_REAR:
    name: Rear camera (200 degree, Sam's)
    zone: rear
    status: tbc
    note: "Sam thinks it's AHD. Set to CVBS/PAL mode, soldered shielded video lead to the analogue-to-ribbon board. Rear or trailer is picked in software when the trailer plug is in. 12 V feed TBC"
    check: "Rear camera: AHD with a CVBS mode? Photo its plug and label"
    pins: {VID: video, VID_GND: video}
  CAM_FRONT:
    name: Camera Module 3 Wide (front)
    zone: dash
    status: planned
    note: Inside the screen housing, 200-300 mm ribbon
    pins: {CSI: csi}
  MODEM_4G:
    name: SIMCom A7670SA 4G board
    zone: dash
    status: placeholder
    optional: true
    note: "6-pin header S G V K T R G. V takes 5-10 V from the spare Mini560 5 V buck. NEVER raw 12 V (10 V max, and the car runs 14.4 V with spikes). K is tied to ground on the board, so it starts by itself. T/R are 115200 baud TTL to the Pi's GPIO 15/14; measure T before connecting (3.3 V ok, else BSS138). Micro USB also on board. Its GNSS (FASE version, u.FL GPS socket on Sam's board) is the dash GPS too, so there is no separate USB GPS. Check on arrival that it gets a fix with the SIM out / 4G off. No USB: it's on the header pins (soldered leads), so texts, GPS and slow data only, no live video over 4G"
    pins: {T: 3v3, R: 3v3}
  CARPLAY:
    name: Carlinkit CPC200-CCPA
    zone: dash
    status: planned
    optional: true
    pins: {USB: usb}
  DAC_HAT:
    name: Raspberry Pi DAC+ (on jumper leads)
    zone: dash
    status: planned
    optional: true
    doc: docs/audio.md
    note: "PCM5122 DAC HAT (ex IQaudio DAC+), RCA line out to the amp. Sits on standoffs in the right-hand end of the Pi box, off the Pi, so the top of the Pi stays free for the AI HAT+ 2. Joined by 7 male-to-female jumper leads (about 20 cm), not a full 40-way ribbon: a ribbon would cover the header pins the CAN board, 4G board and IMU leads plug onto. Uses GPIO 18, 19, 21 (I2S), 2 and 3 (I2C, shared with the IMU: DAC 0x4D, IMU 0x68), 5 V and GND. Nothing else on the Pi uses 18-21 (CAN is SPI0 + GPIO 25, 4G is UART GPIO 14/15). The ID EEPROM pins 27/28 are left off, so it never fights the AI HAT's EEPROM; set the overlay by hand: scripts/audio-setup.sh --i2s iqaudio-dacplus. A dab of hot glue on the leads at both ends against vibration. Later the leads move onto the AI HAT's stacking header pins"
    pins: {BCK: 3v3, LRCK: 3v3, DIN: 3v3, SDA: 3v3, SCL: 3v3, V5: 5v, GND: gnd, OUT: audio}
  AMP:
    name: 4-ch class D amp (AliExpress, 4 x 63 W RMS at 4 ohm)
    zone: cab
    status: confirmed
    note: "Sam's pick. 4 x 63 W RMS at 4 ohm, or 2 x 200 W RMS bridged at 4 ohm; built-in 90 Hz high and low pass; 8-16 V; up to 33 A flat out (16.5 A on music); 145 x 100 x 45 mm. Channels 1 and 2 drive the Kenwoods (set the HPF on). Channels 3 and 4 bridged (200 W at 4 ohm) drive the Kicker KM104 sub (LPF on, gain set so it stays under the sub's 150 W RMS)"
    optional: true
    doc: docs/audio.md
    pins: {B+: 12v, GND: gnd, REM: 12v, IN: audio, SPK: spk, SUB: spk}
  SPEAKERS:
    name: Kenwood KFC-2053MRB 8 in marine speakers (pair)
    zone: cab
    status: confirmed
    note: Sam has these. 8 in 2-way, 4 ohm, about 50 W RMS each (100 W the pair), 180 mm cut-out, about 86 mm mounting depth (Kenwood spec page). One amp channel each; speaker cable 1.5 mm² is plenty. In sealed printed pods on the roll cage (cad/parts/speaker_pod.scad, docs/speaker-pods.md); the cable goes in through a PG7 gland underneath each pod
    optional: true
    pins: {IN: spk}
  SUB:
    name: Kicker KM104 10 in marine subwoofer
    zone: cab
    status: confirmed
    note: "Sam has bought it (18 Nov). 10 in, 4 ohm, 150 W RMS, 30-500 Hz. On amp ch 3 + 4 bridged, low pass on (90 Hz, matches the pods' EQ handover). Sealed printed box under the seat, on hold until Sam scans the space. 1.5 mm² speaker cable"
    optional: true
    pins: {IN: spk}
  IMU:
    name: IMU (roll / pitch)
    zone: dash
    status: planned
    optional: true
    pins: {VCC: 3v3, SDA: 3v3, SCL: 3v3, GND: gnd}

# --------------------------------------------------------------------------
# Wires. One line each: id, from, to, sheet (sys), size, fuse, status, note.
# `fuse` is the fuse that protects this wire, if it isn't on the `from` pin.
# Status left out = the lower of the two devices' statuses.
wires:
  # --- traction (72 V). Cable sizes not in any manual we have.
  - {id: H01, from: PACK.pos, to: HV_ISO.in, sys: hv, status: from_manual, note: "Main pack + to the air-break switch. Size TBC, check for a main HV fuse"}
  - {id: H02, from: HV_ISO.out, to: CONTACTOR.in, sys: hv, status: tbc}
  - {id: H03, from: CONTACTOR.out, to: SG1202.B+, sys: hv, status: tbc}
  - {id: H04, from: PACK.neg, to: SG1202.B-, sys: hv, status: from_manual}
  - {id: H05, from: SG1202.U, to: MOTOR.U, sys: hv, status: from_manual}
  - {id: H06, from: SG1202.V, to: MOTOR.V, sys: hv, status: from_manual}
  - {id: H07, from: SG1202.W, to: MOTOR.W, sys: hv, status: from_manual}
  - {id: H08, from: CONTACTOR.out, to: DCDC.in_pos, sys: hv, status: tbc, note: "Where the DC-DC takes its 72 V from is TBC"}
  - {id: H09, from: PACK.neg, to: DCDC.in_neg, sys: hv, status: tbc}

  # --- Shinegle low voltage
  - {id: S01, from: KIT_KEY.out, to: ESTOP.in, sys: sg, status: planned, optional: true, note: "Without the e-stop, KIT_KEY goes straight to the lock relay or J1-1"}
  - {id: S02, from: ESTOP.out, to: RELAYS2.COM2, sys: sg, status: planned, optional: true}
  - {id: S03, from: RELAYS2.NC2, to: SG1202.J1-1, sys: sg, fuse: 10, mm2: 1.0, status: planned, note: "KSI through 10 A fuse (manual). NC contact so a dead control box never strands you"}
  - {id: S04, from: KIT_KEY.out, to: FNR.COM, sys: sg, status: from_manual, note: "Manual feeds the direction switch from the key"}
  - {id: S05, from: FNR.F, to: SG1202.J1-22, sys: sg, status: from_manual}
  - {id: S06, from: FNR.R, to: SG1202.J1-33, sys: sg, status: from_manual}
  - {id: S07, from: SG1202.J1-25, to: THROTTLE.V12, sys: sg, status: from_manual}
  - {id: S08, from: THROTTLE.WIPER, to: SG1202.J1-16, sys: sg, status: from_manual}
  - {id: S09, from: THROTTLE.GND, to: SG1202.J1-18, sys: sg, status: from_manual}
  - {id: S10, from: THROTTLE.SW, to: SG1202.J1-9, sys: sg, status: from_manual}
  - {id: S11, from: SG1202.J1-25, to: MOTOR.SPD_12V, sys: sg, status: from_manual, note: "Speed sensor plugs J6/J7"}
  - {id: S12, from: MOTOR.SPD_A, to: SG1202.J1-31, sys: sg, status: from_manual}
  - {id: S13, from: MOTOR.SPD_B, to: SG1202.J1-32, sys: sg, status: from_manual}
  - {id: S14, from: MOTOR.SPD_GND, to: SG1202.J1-7, sys: sg, status: from_manual}
  - {id: S15, from: MOTOR.TEMP1, to: SG1202.J1-8, sys: sg, status: from_manual, note: "Motor temp plugs J8/J9"}
  - {id: S16, from: MOTOR.TEMP2, to: SG1202.J1-7, sys: sg, status: from_manual}
  - {id: S17, from: SG1202.J1-6, to: SPEEDO.SPD, sys: sg, status: from_manual, optional: true, note: "Speed pulse. Could also feed the Pico if CAN isn't fitted"}
  - {id: S18, from: SG1202.J3, to: PROG.PLUG, sys: sg, status: tbc, optional: true, note: "Setup only. J3 to J1-25/28/29/7 TBC"}

  # --- 12 V power
  - {id: P01, from: BAT12.pos, to: FB.IN, sys: power, mm2: 10, fuse: 60, status: planned, note: "60 A main fuse at the battery. Was 6 mm² in wiring.md, which the table only rates to 40 A"}
  - {id: P02, from: FB.F12, to: KEY.BAT, sys: power, mm2: 1.0, status: planned}
  - {id: P03, from: KEY.IGN, to: RAIL.BUS, sys: power, mm2: 1.0, fuse: 7.5, status: planned}
  - {id: P04, from: FB.F8, to: RELAYS.COM8, sys: power, mm2: 1.0, status: planned}
  - {id: P05, from: RELAYS.NO8, to: RAIL.BUS, sys: power, mm2: 1.0, fuse: 7.5, status: planned, note: "Power hold, in parallel with the key"}
  - {id: P06, from: RAIL.BUS, to: TVS.K, sys: power, mm2: 1.0, status: planned}
  - {id: P07, from: RAIL.BUS, to: PI_BUCK.VIN, sys: power, mm2: 1.5, status: planned}
  - {id: P08, from: RAIL.BUS, to: PICO_BUCK.VIN, sys: power, mm2: 0.75, fuse: 2, status: planned, note: "2 A inline fuse"}
  - {id: P09, from: PI_BUCK.VOUT, to: PI5.5V, sys: power, mm2: 1.5, status: planned, note: "Short and thick, under 30 cm. Set usb_max_current_enable=1"}
  - {id: P10, from: PICO_BUCK.VOUT, to: PICO.VSYS, sys: power, mm2: 0.5, status: planned}
  - {id: P11, from: PICO_BUCK.VOUT, to: RELAYS.JDVCC, sys: power, mm2: 0.5, status: planned, note: "Relay coils, about 0.6 A for 8"}
  - {id: P12, from: PICO_BUCK.VOUT, to: RELAYS2.JDVCC, sys: power, mm2: 0.5, status: planned, optional: true}
  - {id: P13, from: RAIL.BUS, to: SCREEN_PSU.VIN, sys: power, mm2: 1.0, fuse: 3, status: tbc, note: "Fuse size depends on the screen's draw"}
  - {id: P14, from: SCREEN_PSU.VOUT, to: SCREEN.DC_IN, sys: power, mm2: 1.0, status: tbc}
  - {id: P15, from: FB.F7, to: RELAYS.COM7, sys: power, mm2: 1.5, status: planned, note: "Accessory 12 V, on with ignition"}
  - {id: P20, from: RELAYS.NO7, to: GLOVE_USB.VIN, sys: power, mm2: 0.75, fuse: 3, status: planned, optional: true, note: "3 A inline fuse. Charges the RC phone with the key on; the control box may hold it on for a while after key-off (TBC)"}
  - {id: P16, from: BAT12.pos, to: AMP.B+, sys: power, mm2: 6.0, fuse: 40, status: planned, optional: true, note: "Own 40 A fuse at the battery. The amp pulls up to 33 A flat out, so 6 mm² (good to 40 A on the table)"}
  - {id: P17, from: RAIL.BUS, to: AMP.REM, sys: power, mm2: 0.5, fuse: 2, status: planned, optional: true, note: "Remote turn-on, goes off with the rail"}
  - {id: P18, from: DCDC.out_pos, to: BAT12.pos, sys: power, status: tbc, note: "DC-DC charge lead. Size and fuse depend on its rating"}
  - {id: P19, from: BAT12.pos, to: EPS_ECU.B+, sys: power, mm2: 10, fuse: 60, status: planned, optional: true, note: "Own 60 A fuse and cable straight to the battery (Toyota fuses the Prius EPS at 60 A)"}

  # --- grounds
