# Teryx OS: the whole-vehicle wiring, machine readable.
#
# This file is the source of truth for what connects to what. Everything in
# docs/wiring/ is made from it:
#
#     python -m teryx wiring           check this file, then write docs/wiring/
#     python -m teryx wiring --check   only check it (what CI runs, via tests)
#
# docs/wiring.md explains the why (power hold, diodes, CAN rules). Pin numbers
# on the Pico must match config/io-map.yaml; a test checks that.
#
# Nothing here has been checked on the real Teryx yet. Status of each device
# and each wire:
#   measured    checked on Sam's Teryx with a meter or a photo
#   from_manual drawn in a maker's manual (Shinegle, Kawasaki, Raspberry Pi)
#   confirmed   Sam told us, or a part he owns
#   planned     our own design, written up in docs/, not built yet
#   tbc         we expect it, but something about it is unknown (see `check`)
#   placeholder another thread or a later add-on (AI HAT+ 2, 4G, sentry camera)
# `optional: true` means the Teryx works without it.
#
# Pins: `v` is the voltage domain. A wire may only join two pins with the same
# domain unless it says `via:` (an opto, a divider, a diode, a dongle). Domains:
#   hv      72 V traction pack +          hvneg   72 V pack negative (NOT chassis)
#   motor   3-phase motor (U V W)         sg      Shinegle low voltage side (its own ground, TBC)
#   12v     12 V system                   gnd     chassis ground (12 V negative)
#   5v      5 V logic supply              3v3     3.3 V logic (Pi, Pico, boards)
#   can     CAN H / CAN L                 usb     USB data (+ 5 V)
#   hdmi, csi, pcie, video, audio, spk    the obvious
#   coil    a relay or contactor coil whose voltage is unknown
# `supply: true` pins feed loads. A wire leaving one needs a fuse (`fuse` on
# the wire, or `fuse_a` on the pin) and must be thick enough for that fuse.
# `multi: true` pins (and all gnd / hvneg pins) may take more than one wire.
# `term: true` marks the 120 ohm terminator at each end of a CAN bus.

version: 1

# Smallest wire for a fuse, 12 V runs up to about 5 m. Conservative "RK"
# column of the table at
# https://info.speedingparts.eu/what-cable-size-should-you-use-in-a-12v-automotive-system
# (use a fuse the same as or smaller than the cable's figure). Bundled or
# engine-bay runs: go one size up.
wire_table_mm2_to_max_fuse_a:
  0.5: 5
  0.75: 7.5
  1.0: 10
  1.5: 15
  2.5: 20
  4.0: 30
  6.0: 40
  8.0: 50
  10.0: 70

sheets:
  hv:      {title: "Traction: 72 V pack, controller, motor, DC-DC", root: PACK}
  sg:      {title: "Shinegle low voltage: key, F-N-R, throttle, sensors, programmer", root: SG1202}
  power:   {title: "12 V power: battery, fuses, key, dash rail, bucks", root: BAT12}
  ground:  {title: "Grounds (chassis, star point)", root: GND_STAR}
  can:     {title: "CAN buses: main Teryx bus and the steering bus", root: SG1202}
  logic:   {title: "Control box inside: Pico 2 and its boards", root: PICO}
  inputs:  {title: "12 V signals into the control box (opto board)", root: OPTO}
  lights:  {title: "Lights", root: FB}
  winch:   {title: "Winch", root: BAT12}
  drive:   {title: "Drive: 4WD, diff lock, tray, power steering", root: PICO}
  trailer: {title: "Trailer plug and trailer camera", root: TRAILER}
  dash:    {title: "Dash computer: Pi 5, screen, cameras, USB, audio", root: PI5}

devices:
  # ---------------------------------------------------------------- traction
  PACK:
    name: Traction battery pack
    zone: hv
    status: tbc
    note: 72 V. Size TBC (the range maths assumes 7.5 kWh)
    check: Battery pack make, size (kWh), and where its main fuse is. Photo the label
    pins: {pos: hv, neg: hvneg}
  HV_ISO:
    name: 150 A air-break switch
    zone: hv
    status: from_manual
    note: SG12X2 manual Fig. 2 puts B+ through it
    check: Is the air-break switch fitted, and where? Photo it
    pins: {in: hv, out: hv}
  CONTACTOR:
    name: Main contactor
    zone: hv
    status: tbc
    note: SG1810 fault 13 is "main contactor or brake fault", so there is probably one. Coil wiring not in any manual we have
    check: Is there a main contactor between the pack and the controller? Photo it and trace its two small coil wires
    pins: {in: hv, out: {v: hv, multi: true}, coil_pos: coil, coil_neg: coil}
  SG1202:
    name: Shinegle SG1202 controller
    zone: hv
    status: from_manual
    note: Full J1 pinout in config/shinegle-sg1202.yaml and docs/img/sg1202-wiring.svg
    doc: docs/shinegle-controller.md
    pins:
      B+: hv
      B-: hvneg
      U: motor
      V: motor
      W: motor
      J1-1: {v: sg, desc: KSI key switch power}
      J1-6: {v: sg, desc: speed pulse out}
      J1-7: {v: sg, multi: true, desc: logic ground}
      J1-8: {v: sg, desc: motor temp 1}
      J1-9: {v: sg, desc: throttle switch}
      J1-16: {v: sg, desc: throttle wiper}
      J1-18: {v: sg, desc: throttle ground}
      J1-22: {v: sg, desc: forward}
      J1-25: {v: sg, multi: true, desc: +12 V out}
      J1-28: {v: sg, desc: SCI Tx}
      J1-29: {v: sg, desc: SCI Rx}
      J1-31: {v: sg, desc: speed A}
      J1-32: {v: sg, desc: speed B}
      J1-33: {v: sg, desc: reverse}
      J3: {v: sg, desc: 6-pin programmer port}
      CAN_H: {v: can, term: true, desc: "CAN H (optional on this model, pins TBC)"}
      CAN_L: {v: can, desc: "CAN L (pins TBC)"}
  MOTOR:
    name: 7.5 kW AC motor
    zone: hv
    status: confirmed
    pins: {U: motor, V: motor, W: motor, SPD_A: sg, SPD_B: sg, SPD_12V: sg, SPD_GND: sg, TEMP1: sg, TEMP2: sg}
  DCDC:
    name: DC-DC converter 72 V to 12 V
    zone: hv
    status: tbc
    note: Charges the 12 V battery. Rating TBC; it decides how long winch + steering can run
    check: DC-DC label (amps out), where its 72 V feed comes from, and whether it is isolated (does its 12 V negative join the pack negative?)
    pins: {in_pos: hv, in_neg: hvneg, out_pos: {v: 12v, supply: true}, out_neg: gnd}

  # ------------------------------------------------- Shinegle low voltage side
  KIT_KEY:
    name: Shinegle kit key switch
    zone: cab
    status: tbc
    note: The kit comes with its own key switch. Is it the Teryx key, or a second one?
    check: Is the kit key the same switch as the Teryx key? Meter what voltage reaches J1-1 with the key on (12 V or 72 V)
    pins: {in: sg, out: {v: sg, multi: true}}
  ESTOP:
    name: E-stop button
    zone: cab
    status: planned
    optional: true
    note: For RC mode. In series with KSI so it cuts drive with no software
    doc: docs/power-steering-rc.md
    pins: {in: sg, out: sg}
  FNR:
    name: F-N-R switch
    zone: cab
    status: planned
    note: Physical switch straight to the controller. The reverse side is also tapped for the control box
    pins: {COM: sg, F: sg, R: {v: sg, multi: true}}
  THROTTLE:
    name: Throttle pedal (kit accelerator)
    zone: cab
    status: from_manual
    pins: {V12: sg, WIPER: sg, GND: sg, SW: sg}
  SPEEDO:
    name: Shinegle dash / speed panel
    zone: cab
    status: from_manual
    optional: true
    pins: {SPD: sg}
  PROG:
    name: SG1810 handheld programmer
    zone: cab
    status: from_manual
    optional: true
    note: Only plugged in for setup. Carries 12 V, never into USB
    doc: docs/shinegle-sg1810-programmer.md
    pins: {PLUG: sg}

  # ---------------------------------------------------------- 12 V power
  BAT12:
    name: 12 V aux battery
    zone: engine_bay
    status: confirmed
    note: Kept after the conversion. Charged by the DC-DC
    pins: {pos: {v: 12v, supply: true, multi: true}, neg: gnd}
  GND_STAR:
    name: Ground point (star)
    zone: engine_bay
    status: planned
    note: One solid chassis ground near the fuse block. Every 12 V ground goes here
    pins: {G: gnd}
  FB:
    name: Blade fuse block
    zone: cab
    status: tbc
    note: Needs 16 ways. The 12-way on the parts list is too small, so use an 18 to 20-way or two 12-ways
    check: Pick the fuse block (18-20 way, or two 12-way side by side)
    pins:
      IN: 12v
      F1:  {v: 12v, supply: true, fuse_a: 10,  desc: front bar 1}
      F2:  {v: 12v, supply: true, fuse_a: 10,  desc: front bar 2}
      F3:  {v: 12v, supply: true, fuse_a: 10,  desc: front bar 3}
      F4:  {v: 12v, supply: true, fuse_a: 10,  desc: front bar 4}
      F5:  {v: 12v, supply: true, fuse_a: 5,   desc: interior bar}
      F6:  {v: 12v, supply: true, fuse_a: 10,  desc: relay 1 rear floods}
      F7:  {v: 12v, supply: true, fuse_a: 5,   desc: relay 2 trailer tail}
      F8:  {v: 12v, supply: true, fuse_a: 5,   desc: relay 3 trailer stop}
      F9:  {v: 12v, supply: true, fuse_a: 3,   multi: true, desc: relays 4-6 winch coils}
      F10: {v: 12v, supply: true, fuse_a: 3,   multi: true, desc: winch hand switches, tray limits, trailer reed}
      F11: {v: 12v, supply: true, fuse_a: 10,  desc: relay 7 accessory}
      F12: {v: 12v, supply: true, fuse_a: 7.5, desc: relay 8 power hold}
      F13: {v: 12v, supply: true, fuse_a: 10,  desc: BTS7960 1 diff}
      F14: {v: 12v, supply: true, fuse_a: 10,  desc: BTS7960 2 4WD}
      F15: {v: 12v, supply: true, fuse_a: 15,  desc: BTS7960 3 tray}
      F16: {v: 12v, supply: true, fuse_a: 7.5, desc: key switch}
  KEY:
    name: Teryx key switch
    zone: cab
    status: confirmed
    pins: {BAT: 12v, IGN: {v: 12v, multi: true}}
  RAIL:
    name: Dash 12 V rail
    zone: dash
    status: planned
    note: Key OR relay 8 (power hold). Stays up after key-off until the Pico lets go
    doc: docs/wiring.md
    pins: {BUS: {v: 12v, supply: true, multi: true, fuse_a: 7.5}}
  TVS:
    name: 1.5KE18A TVS diode
    zone: dash
    status: planned
    note: Clamps spikes on the dash rail
    pins: {K: 12v, A: gnd}
  PI_BUCK:
    name: Pololu D36V50F5 5 V 5.5 A
    zone: dash
    status: planned
    note: Pi 5 power. About 16 W of its 27 W with the AI HAT+ 2 fitted
    pins: {VIN: 12v, GND: gnd, VOUT: {v: 5v, multi: true}}
  PICO_BUCK:
    name: Mini560 5 V buck (control box)
    zone: control_box
    status: planned
    pins: {VIN: 12v, GND: gnd, VOUT: {v: 5v, multi: true}}
  SCREEN_PSU:
    name: Screen 12 V supply
    zone: dash
    status: tbc
    note: Depends on the screen's power brick. If it is 12 V, a 12 V stabiliser
    check: Read the label on the screen's power brick (volts and amps)
    pins: {VIN: 12v, GND: gnd, VOUT: 12v}

  # ---------------------------------------------------------- control box
  PICO:
    name: Raspberry Pi Pico 2
    zone: control_box
    status: planned
    doc: docs/io-list.md
    pins:
      VSYS: 5v
      GND: gnd
      3V3: {v: 3v3, multi: true}
      USB: usb
      GP0: 3v3
      GP1: 3v3
      GP2: {v: 3v3, multi: true, desc: SPI0 SCK}
      GP3: {v: 3v3, multi: true, desc: SPI0 MOSI}
      GP4: {v: 3v3, multi: true, desc: SPI0 MISO}
      GP5: {v: 3v3, desc: CAN CS}
      GP6: {v: 3v3, desc: CAN INT}
      GP7: 3v3
      GP8: 3v3
      GP9: 3v3
      GP10: 3v3
      GP11: 3v3
      GP12: 3v3
      GP13: 3v3
      GP14: 3v3
      GP15: 3v3
      GP16: 3v3
      GP17: 3v3
      GP18: 3v3
      GP19: 3v3
      GP20: 3v3
      GP21: 3v3
      GP22: {v: 3v3, desc: steering CAN CS}
      GP26: {v: 3v3, multi: true, desc: I2C1 SDA}
      GP27: {v: 3v3, multi: true, desc: I2C1 SCL}
      GP28: {v: 3v3, desc: ADC2}
  DEBUG:
    name: Debug UART header
    zone: control_box
    status: planned
    note: Inside the box. Vehicle lock workshop reset
    pins: {RX: 3v3, TX: 3v3}
  PICO_CAN:
    name: MCP2515 CAN module (control box)
    zone: control_box
    status: planned
    note: Seeed MCP2515 + SN65HVD230 (3.3 V). Crystal TBC on the bench
    pins: {VCC: 3v3, GND: gnd, SCK: 3v3, SI: 3v3, SO: 3v3, CS: 3v3, INT: 3v3, CANH: can, CANL: can}
  EPS_CAN:
    name: MCP2515 CAN module (steering bus)
    zone: control_box
    status: planned
    optional: true
    note: Own 500 kbit/s bus to the steering ECU. Transmit only, INT not wired
    doc: docs/power-steering-wrecker.md
    pins: {VCC: 3v3, GND: gnd, SCK: 3v3, SI: 3v3, SO: 3v3, CS: 3v3, CANH: {v: can, term: true}, CANL: can}
  MCP1:
    name: MCP23017 I/O expander (0x20)
    zone: control_box
    status: planned
    pins: {VDD: 3v3, GND: gnd, SDA: 3v3, SCL: 3v3, INTB: 3v3,
           A0: 3v3, A1: 3v3, A2: 3v3, A3: 3v3, A4: 3v3, A5: 3v3, A6: 3v3, A7: 3v3,
           B0: 3v3, B1: 3v3, B2: 3v3, B3: 3v3, B4: 3v3, B5: 3v3, B6: 3v3, B7: 3v3}
  MCP2:
    name: Second MCP23017 (0x21)
    zone: control_box
    status: planned
    optional: true
    note: More outputs for the steering enable and the drive lock relay. The first one is full
    doc: docs/vehicle-lock.md
    pins: {VDD: 3v3, GND: gnd, SDA: 3v3, SCL: 3v3, A0: 3v3, A1: 3v3}
  ADS1:
    name: ADS1115 ADC (0x48)
    zone: control_box
    status: planned
    note: ALERT pin left free so GP22 can be the steering CAN chip select (read "ready" over I2C)
    pins: {VDD: {v: 3v3, multi: true}, GND: gnd, SDA: 3v3, SCL: 3v3, A0: 3v3, A1: 3v3, A2: 3v3, A3: 3v3}
  ADS2:
    name: Second ADS1115 (0x49)
    zone: control_box
    status: planned
    optional: true
    note: Brake pedal regen only
    doc: docs/brake-regen.md
    pins: {VDD: 3v3, GND: gnd, SDA: 3v3, SCL: 3v3, A0: 3v3, A1: 3v3}
  OPTO:
    name: 8-ch opto board (PC817, 12 V in)
    zone: control_box
    status: planned
    pins: {VCC: 3v3, GND: gnd, COM12: gnd,
           IN1: 12v, IN2: 12v, IN3: {v: 12v, multi: true}, IN4: 12v, IN5: 12v, IN6: {v: 12v, multi: true}, IN7: 12v, IN8: 12v,
           OUT1: 3v3, OUT2: 3v3, OUT3: 3v3, OUT4: 3v3, OUT5: 3v3, OUT6: 3v3, OUT7: 3v3, OUT8: 3v3}
  RELAYS:
    name: 8-ch relay board
    zone: control_box
    status: confirmed
    note: Owned. JD-VCC jumper off, coils on 5 V, inputs from 3.3 V
    check: Does the relay board click from 3.3 V logic? Active high or low?
    pins: {VCC: 3v3, JDVCC: 5v, GND: gnd,
           IN1: 3v3, IN2: 3v3, IN3: 3v3, IN4: 3v3, IN5: 3v3, IN6: 3v3, IN7: 3v3, IN8: 3v3,
           COM1: 12v, COM2: 12v, COM3: 12v, COM4: 12v, COM5: 12v, COM6: 12v, COM7: 12v, COM8: 12v,
           NO1: {v: 12v, multi: true}, NO2: 12v, NO3: 12v, NO4: 12v, NO5: 12v, NO6: 12v, NO7: {v: 12v, supply: true, multi: true, fuse_a: 10}, NO8: 12v}
  RELAYS2:
    name: 2-ch relay board
    zone: control_box
    status: planned
    optional: true
    note: Relay 9 steering enable, relay 10 drive lock (uses the NC contact)
    pins: {VCC: 3v3, JDVCC: 5v, GND: gnd, IN1: 3v3, IN2: 3v3, COM1: 12v, NO1: 12v, COM2: sg, NC2: sg}
  BTS1:
    name: BTS7960 1 (front diff)
    zone: control_box
    status: confirmed
    pins: &bts {VCC: 3v3, GND: gnd, RPWM: 3v3, LPWM: 3v3, EN: 3v3, IS: 3v3, B+: 12v, B-: gnd, M+: 12v, M-: 12v}
  BTS2:
    name: BTS7960 2 (2WD/4WD)
    zone: control_box
    status: planned
    pins: *bts
  BTS3:
    name: BTS7960 3 (tray)
    zone: control_box
    status: planned
    pins: *bts
  MOSFET:
    name: 5-ch MOSFET board (low side)
    zone: control_box
    status: planned
    note: Logic-level MOSFETs that fully turn on from 3.3 V
    pins: {GND: gnd, IN1: 3v3, IN2: 3v3, IN3: 3v3, IN4: 3v3, IN5: 3v3, OUT1: 12v, OUT2: 12v, OUT3: 12v, OUT4: 12v, OUT5: 12v}

  # ---------------------------------------------------------- lights
  LB1: {name: Front bar 1 (far left), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB2: {name: Front bar 2 (inner left), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB3: {name: Front bar 3 (inner right), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB4: {name: Front bar 4 (far right), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB_INT: {name: Interior 7 in bar, zone: cab, status: confirmed, pins: {pos: 12v, neg: 12v}}
  FLOOD_L:
    name: Rear flood left (4 in pod)
    zone: rear
    status: confirmed
    note: Outside of the roll cage mounting plate. Also the reverse light
    check: Light bars and pods dim with PWM? Test one on a cheap dimmer
    pins: {pos: 12v, neg: gnd}
  FLOOD_R: {name: Rear flood right (4 in pod), zone: rear, status: confirmed, pins: {pos: 12v, neg: gnd}}

  # ---------------------------------------------------------- winch
  BRK_WINCH:
    name: 250 A breaker
    zone: engine_bay
    status: planned
    pins: {in: 12v, out: 12v}
  WINCH_ISO:
    name: Winch isolator contactor
    zone: engine_bay
    status: planned
    note: Only on while the winch is armed on the dash (relay 6)
    check: Do the remote and hand switches need to work with the dash dead? If so the isolator needs a second coil feed from a hidden key switch
    pins: {in: 12v, out: 12v, coil_pos: 12v, coil_neg: gnd}
  WINCH_SOL:
    name: XBull solenoid box
    zone: front
    status: confirmed
    check: Photo the XBull solenoid box terminals and the remote plug pins
    pins: {B+: 12v, M1: 12v, M2: 12v, GND: gnd, COIL_IN: {v: 12v, multi: true}, COIL_OUT: {v: 12v, multi: true}, REMOTE: 12v}
  WINCH_MOTOR:
    name: XBull 5000 lb winch motor
    zone: front
    status: confirmed
    pins: {M1: 12v, M2: 12v}
  WINCH_REMOTE:
    name: XBull handheld remote
    zone: front
    status: confirmed
    pins: {PLUG: 12v}
  HSW_WINCH:
    name: Hidden winch switch (at the winch)
    zone: front
    status: confirmed
    note: Momentary (ON)-OFF-(ON)
    pins: {FEED: 12v, IN: {v: 12v, multi: true}, OUT: {v: 12v, multi: true}}
  HSW_CAB:
    name: Hidden winch switch (in the cab)
    zone: cab
    status: confirmed
    note: Momentary (ON)-OFF-(ON)
    pins: {FEED: 12v, IN: {v: 12v, multi: true}, OUT: {v: 12v, multi: true}}

  # ---------------------------------------------------------- drive
  ACT_DIFF:
    name: Front diff lock actuator (50 mm, pot)
    zone: front
    status: confirmed
    pins: {M+: 12v, M-: 12v, POT_HI: 3v3, POT_W: 3v3, POT_LO: gnd}
  ACT_4WD:
    name: 2WD/4WD actuator
    zone: front
    status: tbc
    note: 50 mm actuator, or drive the stock Kawasaki electric 4WD actuator instead
    check: Is the stock electric 4WD actuator still on the front diff, and is the dash 2WD/4WD switch still wired to it? Photo its plug
    doc: docs/teryx-drivetrain.md
    pins: {M+: 12v, M-: 12v}
  ACT_TRAY:
    name: Tray lift actuator (400 mm)
    zone: rear
    status: confirmed
    pins: {M+: 12v, M-: 12v}
  LIM_DN: {name: Tray down limit (NC), zone: rear, status: planned, pins: {C: {v: 12v, multi: true}, NC: 12v}}
  LIM_UP: {name: Tray up limit (NC), zone: rear, status: planned, pins: {C: {v: 12v, multi: true}, NC: 12v}}
  BRAKE_SW:
    name: Brake light switch (stock)
    zone: cab
    status: tbc
    check: Find the brake light switch wire and meter it (12 V when pressed?)
    pins: {OUT: {v: 12v, multi: true}}
  PARK_SW:
    name: Parking brake switch (stock)
    zone: cab
    status: tbc
    note: Lights the red parking brake light in the meter
    check: Find the parking brake switch wire at the meter plug. Does it switch ground or 12 V?
    pins: {OUT: 12v}
  BRAKE_PEDAL:
    name: Brake pedal Hall sensor
    zone: cab
    status: planned
    optional: true
    note: Brake regen only, once the Shinegle check passes
    doc: docs/brake-regen.md
    pins: {V5: 5v, SIG: 5v, GND: gnd}
  BRAKE_PRESS:
    name: Brake line pressure sensor
    zone: front
    status: planned
    optional: true
    note: Optional cross-check for the pedal sensor, 0.5-4.5 V
    doc: docs/brake-regen.md
    pins: {V5: 5v, SIG: 5v, GND: gnd}
  EPS_ECU:
    name: Toyota Aqua EPS ECU (89650-52B51)
    zone: cab
    status: tbc
    optional: true
    note: Wrecker column, bench test with the Prius CAN frames first. ECU plug pinout TBC
    check: Photo both EPS ECU plugs (pin numbers and wire colours) when the column is picked up
    doc: docs/power-steering-wrecker.md
    pins: {B+: 12v, GND: gnd, IG: 12v, CANH: {v: can, term: true}, CANL: can, MOTOR: 12v}
  EPS_COL:
    name: Aqua steering column (motor + torque sensor)
    zone: cab
    status: tbc
    optional: true
    note: Motor and torque sensor plugs go to the ECU on Toyota's own loom
    check: Measure the space from the steering wheel to where the Teryx shaft goes to the rack
    pins: {MOTOR: 12v}

  # ---------------------------------------------------------- trailer
  TRAILER:
    name: 7-pin flat trailer socket (Narva 82043BL, reed switch)
    zone: rear
    status: planned
    doc: docs/cameras.md
    check: Which way does the Narva reed switch switch, and what triggers it?
    pins: {P1_LEFT: 12v, P2_REV: 12v, P3_EARTH: gnd, P4_RIGHT: 12v, P5_BRAKES: 12v, P6_STOP: {v: 12v, multi: true}, P7_TAIL: 12v, REED_A: 12v, REED_B: 12v}
  TCAM_PLUG:
    name: Trailer camera 4-pin plug
    zone: rear
    status: planned
    optional: true
