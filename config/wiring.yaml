# Teryx OS: the whole-vehicle wiring, machine readable.
#
# This file is the source of truth for what connects to what. Everything in
# docs/wiring/ is made from it:
#
#     python -m teryx wiring           check this file, then write docs/wiring/
#     python -m teryx wiring --check   only check it (what CI runs, via tests)
#
# docs/wiring.md explains the why (power hold, diodes, CAN rules). Pin numbers
# on the Pico must match config/io-map.yaml; a test checks that.
#
# Nothing here has been checked on the real Teryx yet. Status of each device
# and each wire:
#   measured    checked on Sam's Teryx with a meter or a photo
#   from_manual drawn in a maker's manual (Shinegle, Kawasaki, Raspberry Pi)
#   confirmed   Sam told us, or a part he owns
#   planned     our own design, written up in docs/, not built yet
#   tbc         we expect it, but something about it is unknown (see `check`)
#   placeholder another thread or a later add-on (AI HAT+ 2, 4G, sentry camera)
# `optional: true` means the Teryx works without it.
#
# Pins: `v` is the voltage domain. A wire may only join two pins with the same
# domain unless it says `via:` (an opto, a divider, a diode, a dongle). Domains:
#   hv      72 V traction pack +          hvneg   72 V pack negative (NOT chassis)
#   motor   3-phase motor (U V W)         sg      Shinegle low voltage side (its own ground, TBC)
#   12v     12 V system                   gnd     chassis ground (12 V negative)
#   5v      5 V logic supply              3v3     3.3 V logic (Pi, Pico, boards)
#   can     CAN H / CAN L                 usb     USB data (+ 5 V)
#   hdmi, csi, pcie, video, audio, spk    the obvious
#   coil    a relay or contactor coil whose voltage is unknown
# `supply: true` pins feed loads. A wire leaving one needs a fuse (`fuse` on
# the wire, or `fuse_a` on the pin) and must be thick enough for that fuse.
# `multi: true` pins (and all gnd / hvneg pins) may take more than one wire.
# `term: true` marks the 120 ohm terminator at each end of a CAN bus.

version: 1

# Smallest wire for a fuse, 12 V runs up to about 5 m. Conservative "RK"
# column of the table at
# https://info.speedingparts.eu/what-cable-size-should-you-use-in-a-12v-automotive-system
# (use a fuse the same as or smaller than the cable's figure). Bundled or
# engine-bay runs: go one size up.
wire_table_mm2_to_max_fuse_a:
  0.5: 5
  0.75: 7.5
  1.0: 10
  1.5: 15
  2.5: 20
  4.0: 30
  6.0: 40
  8.0: 50
  10.0: 70

sheets:
  hv:      {title: "Traction: 72 V pack, controller, motor, DC-DC", root: PACK}
  sg:      {title: "Shinegle low voltage: key, F-N-R, throttle, sensors, programmer", root: SG1202}
  power:   {title: "12 V power: battery, fuses, key, dash rail, bucks", root: BAT12}
  ground:  {title: "Grounds (chassis, star point)", root: GND_STAR}
  can:     {title: "CAN buses: main Teryx bus and the steering bus", root: SG1202}
  logic:   {title: "Control box inside: Pico 2 and its boards", root: PICO}
  inputs:  {title: "12 V signals into the control box (opto board)", root: OPTO}
  lights:  {title: "Lights", root: FB}
  winch:   {title: "Winch", root: BAT12}
  drive:   {title: "Drive: 4WD, diff lock, tray, power steering", root: PICO}
  trailer: {title: "Trailer plug and trailer camera", root: TRAILER}
  dash:    {title: "Dash computer: Pi 5, screen, cameras, USB, audio", root: PI5}

devices:
  # ---------------------------------------------------------------- traction
  PACK:
    name: Traction battery pack
    zone: hv
    status: tbc
    note: 72 V. Size TBC (the range maths assumes 7.5 kWh)
    check: Battery pack make, size (kWh), and where its main fuse is. Photo the label
    pins: {pos: hv, neg: hvneg}
  HV_ISO:
    name: 150 A air-break switch
    zone: hv
    status: from_manual
    note: SG12X2 manual Fig. 2 puts B+ through it
    check: Is the air-break switch fitted, and where? Photo it
    pins: {in: hv, out: hv}
  CONTACTOR:
    name: Main contactor
    zone: hv
    status: tbc
    note: SG1810 fault 13 is "main contactor or brake fault", so there is probably one. Coil wiring not in any manual we have
    check: Is there a main contactor between the pack and the controller? Photo it and trace its two small coil wires
    pins: {in: hv, out: {v: hv, multi: true}, coil_pos: coil, coil_neg: coil}
  SG1202:
    name: Shinegle SG1202 controller
    zone: hv
    status: from_manual
    note: Full J1 pinout in config/shinegle-sg1202.yaml and docs/img/sg1202-wiring.svg
    doc: docs/shinegle-controller.md
    pins:
      B+: hv
      B-: hvneg
      U: motor
      V: motor
      W: motor
      J1-1: {v: sg, desc: KSI key switch power}
      J1-6: {v: sg, desc: speed pulse out}
      J1-7: {v: sg, multi: true, desc: logic ground}
      J1-8: {v: sg, desc: motor temp 1}
      J1-9: {v: sg, desc: throttle switch}
      J1-16: {v: sg, desc: throttle wiper}
      J1-18: {v: sg, desc: throttle ground}
      J1-22: {v: sg, desc: forward}
      J1-25: {v: sg, multi: true, desc: +12 V out}
      J1-28: {v: sg, desc: SCI Tx}
      J1-29: {v: sg, desc: SCI Rx}
      J1-31: {v: sg, desc: speed A}
      J1-32: {v: sg, desc: speed B}
      J1-33: {v: sg, desc: reverse}
      J3: {v: sg, desc: 6-pin programmer port}
      CAN_H: {v: can, term: true, desc: "CAN H (optional on this model, pins TBC)"}
      CAN_L: {v: can, desc: "CAN L (pins TBC)"}
  MOTOR:
    name: 7.5 kW AC motor
    zone: hv
    status: confirmed
    pins: {U: motor, V: motor, W: motor, SPD_A: sg, SPD_B: sg, SPD_12V: sg, SPD_GND: sg, TEMP1: sg, TEMP2: sg}
  DCDC:
    name: DC-DC converter 72 V to 12 V
    zone: hv
    status: tbc
    note: Charges the 12 V battery. Rating TBC; it decides how long winch + steering can run
    check: DC-DC label (amps out), where its 72 V feed comes from, and whether it is isolated (does its 12 V negative join the pack negative?)
    pins: {in_pos: hv, in_neg: hvneg, out_pos: {v: 12v, supply: true}, out_neg: gnd}

  # ------------------------------------------------- Shinegle low voltage side
  KIT_KEY:
    name: Shinegle kit key switch
    zone: cab
    status: tbc
    note: The kit comes with its own key switch. Is it the Teryx key, or a second one?
    check: Is the kit key the same switch as the Teryx key? Meter what voltage reaches J1-1 with the key on (12 V or 72 V)
    pins: {in: sg, out: {v: sg, multi: true}}
  ESTOP:
    name: E-stop button
    zone: cab
    status: planned
    optional: true
    note: For RC mode. In series with KSI so it cuts drive with no software
    doc: docs/power-steering-rc.md
    pins: {in: sg, out: sg}
  FNR:
    name: F-N-R switch
    zone: cab
    status: planned
    note: Physical switch straight to the controller. The reverse side is also tapped for the control box
    pins: {COM: sg, F: sg, R: {v: sg, multi: true}}
  THROTTLE:
    name: Throttle pedal (kit accelerator)
    zone: cab
    status: from_manual
    pins: {V12: sg, WIPER: sg, GND: sg, SW: sg}
  SPEEDO:
    name: Shinegle dash / speed panel
    zone: cab
    status: from_manual
    optional: true
    pins: {SPD: sg}
  PROG:
    name: SG1810 handheld programmer
    zone: cab
    status: from_manual
    optional: true
    note: Only plugged in for setup. Carries 12 V, never into USB
    doc: docs/shinegle-sg1810-programmer.md
    pins: {PLUG: sg}

  # ---------------------------------------------------------- 12 V power
  BAT12:
    name: 12 V aux battery
    zone: engine_bay
    status: confirmed
    note: Kept after the conversion. Charged by the DC-DC
    pins: {pos: {v: 12v, supply: true, multi: true}, neg: gnd}
  GND_STAR:
    name: Ground point (star)
    zone: engine_bay
    status: planned
    note: One solid chassis ground near the fuse block. Every 12 V ground goes here
    pins: {G: gnd}
  FB:
    name: Blade fuse block
    zone: cab
    status: tbc
    note: 12 fuses in use. Small loads that can go out together share a fuse (front bars in pairs, trailer tail + stop, interior bar + accessory). All four front bars are NOT on one fuse, so one fault can't black out the front at night. The winch, control box power, key, power hold and each actuator keep their own. Sam's 12-way (in the post) is used, so it is full with no spares; add a small 6-way next to it if more circuits come
    check: Check the 12-way's rating (want 30 A per way, about 100 A total, a cover). Read the front bar labels. Each pair (1+4, 2+3) must draw under about 12 A together (about 140 W) to share a 15 A fuse. If not, give each bar its own 10 A again
    pins:
      IN: {v: 12v, multi: true}
      F1:  {v: 12v, supply: true, fuse_a: 15,  multi: true, desc: front bars 1 + 4 (outer pair)}
      F2:  {v: 12v, supply: true, fuse_a: 15,  multi: true, desc: front bars 2 + 3 (inner pair)}
      F3:  {v: 12v, supply: true, fuse_a: 10,  multi: true, desc: "rear floods (MOSFET 7-8) + relay 1 trailer reverse pin"}
      F4:  {v: 12v, supply: true, fuse_a: 7.5, desc: BTS7960 8 trailer tail + stop}
      F5:  {v: 12v, supply: true, fuse_a: 3,   multi: true, desc: relays 4-5 winch coils}
      F6:  {v: 12v, supply: true, fuse_a: 3,   multi: true, desc: "winch hand switches, tray limits, trailer reed"}
      F7:  {v: 12v, supply: true, fuse_a: 10,  multi: true, desc: "extras - interior bar + relay 7 accessory (phone charger, trailer cam)"}
      F8:  {v: 12v, supply: true, fuse_a: 7.5, desc: relay 8 power hold}
      F9:  {v: 12v, supply: true, fuse_a: 10,  desc: BTS7960 1 diff}
      F10: {v: 12v, supply: true, fuse_a: 10,  desc: BTS7960 2 4WD}
      F11: {v: 12v, supply: true, fuse_a: 15,  desc: BTS7960 3 tray}
      F12: {v: 12v, supply: true, fuse_a: 7.5, desc: key switch}
  FB2:
    name: Small 6-way blade fuse block (stock lights + beacon)
    zone: cab
    status: planned
    note: "Next to the 12-way, which is full. Fed off the 12-way's feed stud through its own 30 A fuse. 1 way spare"
    pins:
      IN: 12v
      F1: {v: 12v, supply: true, fuse_a: 10, desc: BTS7960 4 left headlight}
      F2: {v: 12v, supply: true, fuse_a: 10, desc: BTS7960 5 right headlight}
      F3: {v: 12v, supply: true, fuse_a: 10, multi: true, desc: BTS7960 6-7 tail + brake lights}
      F4: {v: 12v, supply: true, fuse_a: 5, desc: roof beacon}
      F5: {v: 12v, supply: true, fuse_a: 10, desc: backup lights toggle (low beams + tails)}
  KEY:
    name: Teryx key switch
    zone: cab
    status: confirmed
    pins: {BAT: 12v, IGN: {v: 12v, multi: true}}
  RAIL:
    name: Dash 12 V rail
    zone: dash
    status: planned
    note: Key OR relay 8 (power hold). Stays up after key-off until the Pico lets go
    doc: docs/wiring.md
    pins: {BUS: {v: 12v, supply: true, multi: true, fuse_a: 7.5}}
  TVS:
    name: 1.5KE18A TVS diode
    zone: dash
    status: planned
    note: Clamps spikes on the dash rail
    pins: {K: 12v, A: gnd}
  PI_BUCK:
    name: Pololu D36V50F5 5 V 5.5 A
    zone: dash
    status: planned
    note: Pi 5 power. About 16 W of its 27 W with the AI HAT+ 2 fitted
    pins: {VIN: 12v, GND: gnd, VOUT: {v: 5v, multi: true}}
  PICO_BUCK:
    name: Mini560 5 V buck (control box)
    zone: control_box
    status: planned
    pins: {VIN: 12v, GND: gnd, VOUT: {v: 5v, multi: true}}
  SCREEN_PSU:
    name: Screen 12 V supply
    zone: dash
    status: tbc
    note: "LTC3780 buck-boost board (5-32 V in, set to 12.0 V, 80 W) in the Pi box. Keeps the screen on a steady 12 V while the battery swings 11-14.4 V. No reverse-polarity protection, so it sits after the fuse. Skip it if the screen's own board says 9-36 V in"
    check: Read the label on the screen's power brick (volts and amps)
    pins: {VIN: 12v, GND: gnd, VOUT: 12v}

  # ---------------------------------------------------------- control box
  PICO:
    name: Raspberry Pi Pico 2
    zone: control_box
    status: planned
    note: "Talks to the Pi over CAN only. No USB lead to the Pi; reflash with a laptop on its own USB port in the workshop"
    doc: docs/io-list.md
    pins:
      VSYS: 5v
      GND: gnd
      3V3: {v: 3v3, multi: true}
      GP0: 3v3
      GP1: 3v3
      GP2: {v: 3v3, multi: true, desc: SPI0 SCK}
      GP3: {v: 3v3, multi: true, desc: SPI0 MOSI}
      GP4: {v: 3v3, multi: true, desc: SPI0 MISO}
      GP5: {v: 3v3, desc: CAN CS}
      GP6: {v: 3v3, desc: CAN INT}
      GP7: 3v3
      GP8: 3v3
      GP9: 3v3
      GP10: 3v3
      GP11: 3v3
      GP12: 3v3
      GP13: 3v3
      GP14: 3v3
      GP15: 3v3
      GP16: 3v3
      GP17: 3v3
      GP18: 3v3
      GP19: 3v3
      GP20: 3v3
      GP21: 3v3
      GP22: {v: 3v3, desc: steering CAN CS}
      GP26: {v: 3v3, multi: true, desc: I2C1 SDA}
      GP27: {v: 3v3, multi: true, desc: I2C1 SCL}
      GP28: {v: 3v3, desc: ADC2}
  DEBUG:
    name: Debug UART header
    zone: control_box
    status: planned
    note: Inside the box. Vehicle lock workshop reset
    pins: {RX: 3v3, TX: 3v3}
  PICO_CAN:
    name: MCP2515 CAN module (control box)
    zone: control_box
    status: planned
    note: Seeed MCP2515 + SN65HVD230 (3.3 V). Crystal TBC on the bench
    pins: {VCC: 3v3, GND: gnd, SCK: 3v3, SI: 3v3, SO: 3v3, CS: 3v3, INT: 3v3, CANH: can, CANL: can}
  EPS_CAN:
    name: MCP2515 CAN module (steering bus)
    zone: control_box
    status: planned
    optional: true
    note: Own 500 kbit/s bus to the steering ECU. Transmit only, INT not wired
    doc: docs/power-steering-wrecker.md
    pins: {VCC: 3v3, GND: gnd, SCK: 3v3, SI: 3v3, SO: 3v3, CS: 3v3, CANH: {v: can, term: true}, CANL: can}
  MCP1:
    name: MCP23017 I/O expander (0x20)
    zone: control_box
    status: planned
    pins: {VDD: 3v3, GND: gnd, SDA: 3v3, SCL: 3v3, INTB: 3v3,
           A0: 3v3, A1: 3v3, A2: 3v3, A3: 3v3, A4: 3v3, A5: 3v3, A6: 3v3, A7: 3v3,
           B0: 3v3, B1: 3v3, B2: 3v3, B3: 3v3, B4: 3v3, B5: 3v3, B6: 3v3, B7: 3v3}
  MCP2:
    name: Second MCP23017 (0x21)
    zone: control_box
    status: planned
    optional: true
    note: More outputs for the steering enable and the drive lock relay. The first one is full
    doc: docs/vehicle-lock.md
    pins: {VDD: 3v3, GND: gnd, SDA: 3v3, SCL: 3v3, A0: 3v3, A1: 3v3}
  PCA:
    name: PCA9685 16-ch PWM board (0x40)
    zone: control_box
    status: planned
    optional: true
    note: "Every light that isn't a front bar or the cabin bar dims through this (docs/lights.md). Wires soldered straight to the pads, no header pins. VCC 3.3 V so the outputs are 3.3 V, which the MOSFET boards (3-20 V input) and the BTS7960s (3.3 V logic like BTS1-3) take. Leave V+ (servo power) empty. OE tied low on the board. PWM0 trailer bar, 1-10 stock lights on BTS7960 4-8, 11-12 rear floods, 13-14 beacon amber / white on BTS7960 9, 15 BTS7960 enable. All outputs are off at power-up"
    pins: {VCC: 3v3, SDA: 3v3, SCL: 3v3, PWM0: 3v3, PWM1: 3v3, PWM2: 3v3, PWM3: 3v3, PWM4: 3v3, PWM5: 3v3, PWM6: 3v3,
           PWM7: 3v3, PWM8: 3v3, PWM9: 3v3, PWM10: 3v3, PWM11: 3v3, PWM12: 3v3, PWM13: 3v3, PWM14: 3v3,
           PWM15: {v: 3v3, multi: true, desc: "BTS7960 4-9 enable (off at power-up)"}}
  ADS1:
    name: ADS1115 ADC (0x48)
    zone: control_box
    status: planned
    note: ALERT pin left free so GP22 can be the steering CAN chip select (read "ready" over I2C)
    pins: {VDD: {v: 3v3, multi: true}, GND: gnd, SDA: 3v3, SCL: 3v3, A0: 3v3, A1: 3v3, A2: 3v3, A3: 3v3}
  ADS2:
    name: Second ADS1115 (0x49)
    zone: control_box
    status: planned
    optional: true
    note: Brake pedal regen only
    doc: docs/brake-regen.md
    pins: {VDD: 3v3, GND: gnd, SDA: 3v3, SCL: 3v3, A0: 3v3, A1: 3v3}
  OPTO:
    name: 8-ch opto board (PC817, 12 V in)
    zone: control_box
    status: planned
    note: All 8 channels used. A second 8-ch board (AliExpress cart) gives 8 spare inputs, read on MCP2 port B
    pins: {VCC: 3v3, GND: gnd, COM12: gnd,
           IN1: 12v, IN2: 12v, IN3: {v: 12v, multi: true}, IN4: 12v, IN5: 12v, IN6: {v: 12v, multi: true}, IN7: 12v, IN8: 12v,
           OUT1: 3v3, OUT2: 3v3, OUT3: 3v3, OUT4: 3v3, OUT5: 3v3, OUT6: 3v3, OUT7: 3v3, OUT8: 3v3}
  RELAYS:
    name: 16-ch relay board, channels 1-8
    zone: control_box
    status: planned
    note: One 16-channel board of mechanical 5 V relays with opto and JD-VCC jumper (AliExpress cart), in an aux box next to the control box. RELAYS2 is channels 9-16 of the same board. The solid state G3MB-202P board Sam has is AC only and won't turn off on 12 V DC. JD-VCC jumper off, coils on 5 V, inputs from 3.3 V
    check: Does the relay board click from 3.3 V logic? Active high or low? Relays are SRD-05VDC type, 10 A at 28-30 V DC. Keep each load under about 7 A. Nothing on the relays gets near that now the floods are on the MOSFET board (relay 1 only feeds the trailer reversing lamp)
    # Relay loads (none carry big current): 1 trailer reversing pin, 2-3 spare (trailer tail/stop moved to BTS8), 4-5 winch solenoid COILS only, 6 spare (isolator dropped)
    # (the winch motor current goes through its own contactor), 7 accessory (phone charger + trailer cam, about 5 A), 8 power hold (dash rail, about 5 A).
    # All other lights are on the MOSFET and BTS7960 boards via the PCA9685. 7 of 16 relays used, 9 spare
    pins: {VCC: 3v3, JDVCC: 5v, GND: gnd,
           IN1: 3v3, IN2: 3v3, IN3: 3v3, IN4: 3v3, IN5: 3v3, IN6: 3v3, IN7: 3v3, IN8: 3v3,
           COM1: 12v, COM2: 12v, COM3: 12v, COM4: 12v, COM5: 12v, COM6: 12v, COM7: 12v, COM8: 12v,
           NO1: {v: 12v, multi: true}, NO2: 12v, NO3: 12v, NO4: 12v, NO5: 12v, NO6: 12v, NO7: {v: 12v, supply: true, multi: true, fuse_a: 10}, NO8: 12v}
  RELAYS2:
    name: 16-ch relay board, channels 9-16 (2 used, 6 spare)
    zone: control_box
    status: planned
    optional: true
    note: Same board as RELAYS. Relay 9 steering enable, relay 10 drive lock (uses the NC contact)
    check: Relay 10 is rated 30 V DC. If the Shinegle KSI turns out to be 72 V (see KIT_KEY), swap relay 10 for one rated 80 V DC or more
    pins: {VCC: 3v3, JDVCC: 5v, GND: gnd, IN1: 3v3, IN2: 3v3, COM1: 12v, NO1: 12v, COM2: sg, NC2: sg}
  BTS1:
    name: BTS7960 1 (front diff)
    zone: control_box
    status: confirmed
    pins: &bts {VCC: 3v3, GND: gnd, RPWM: 3v3, LPWM: 3v3, EN: 3v3, IS: 3v3, B+: 12v, B-: gnd, M+: 12v, M-: 12v}
  BTS2:
    name: BTS7960 2 (2WD/4WD)
    zone: control_box
    status: planned
    pins: *bts
  BTS3:
    name: BTS7960 3 (tray)
    zone: control_box
    status: planned
    pins: *bts
  # BTS7960 4-8: the stock lamps. Their bulbs are dual filament with ONE shared earth, so a
  # low-side MOSFET can't switch each filament on its own. Each BTS7960 is two high-side
  # switches: RPWM drives M+, LPWM drives M-, each to its own filament (docs/lights.md).
  BTS4:
    name: BTS7960 4 (left headlight low / high)
    zone: control_box
    status: planned
    note: "Used as two high-side switches, not a motor bridge. VCC from the Pico 3.3 V like BTS1-3. EN (R_EN + L_EN) from PCA9685 PWM15 with a 10k to ground, so the lamps stay off until the Pico is running"
    pins: &btsl {VCC: 3v3, GND: gnd, RPWM: 3v3, LPWM: 3v3, EN: 3v3, IS: 3v3, B+: 12v, B-: gnd, M+: 12v, M-: 12v}
  BTS5: {name: BTS7960 5 (right headlight low / high), zone: control_box, status: planned, pins: *btsl}
  BTS6: {name: BTS7960 6 (left tail / brake), zone: control_box, status: planned, pins: *btsl}
  BTS7: {name: BTS7960 7 (right tail / brake), zone: control_box, status: planned, pins: *btsl}
  BTS8: {name: BTS7960 8 (trailer tail / stop), zone: control_box, status: planned, pins: *btsl}
  BTS9:
    name: BTS7960 9 (roof beacon amber / white)
    zone: control_box
    status: planned
    note: "Two-colour beacons usually share one earth wire, so the colours are switched on the + side like the stock lamps: RPWM amber, LPWM white"
    pins: *btsl
  MOSFET:
    name: 8-ch isolated MOSFET board (low side, all 8 used)
    zone: control_box
    status: planned
    note: "Sam's board: 8-channel opto-isolated MOSFET driver, DC 3.7-27 V, 10 A per channel, PWM input 3-20 V, 0-20 kHz. 1-4 front bars, 5 cabin bar, 6 trailer bar, 7-8 rear floods. Low side switching, so each light's + comes from its fuse and its - goes to an OUT pin"
    check: The listing must say 3.3 V input, PNP / high-level trigger (firmware drives the pins high for on; pins sit low at boot so lights stay off), at least 24 V load and 10 A per channel. If it only says 5 A, use single LR7843 modules instead
    pins: {GND: gnd, IN1: 3v3, IN2: 3v3, IN3: 3v3, IN4: 3v3, IN5: 3v3, OUT1: 12v, OUT2: 12v, OUT3: 12v, OUT4: 12v, OUT5: 12v, IN6: 3v3, OUT6: 12v,
           IN7: 3v3, OUT7: 12v, IN8: 3v3, OUT8: 12v}
  # ---------------------------------------------------------- lights
  LB1: {name: Front bar 1 (far left), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB2: {name: Front bar 2 (inner left), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB3: {name: Front bar 3 (inner right), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB4: {name: Front bar 4 (far right), zone: front, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB_INT: {name: Interior 7 in bar, zone: cab, status: confirmed, pins: {pos: 12v, neg: 12v}}
  LB_TRL: {name: Trailer light bar (Sam's spare), zone: trailer, status: planned, optional: true, note: "On the trailer, through the 8-pin plug. On/off from the dash and the phone remote; only live when the trailer plug is in", pins: {pos: 12v, neg: 12v}}
  FLOOD_L:
    name: Rear flood left (4 in pod)
    zone: rear
    status: confirmed
    note: Outside of the roll cage mounting plate. Also the reverse light. Dimmable on MOSFET channel 7 (left) and 8 (right)
    check: Light bars and pods dim with PWM? Test one on a cheap dimmer
    pins: {pos: 12v, neg: 12v}
  FLOOD_R: {name: Rear flood right (4 in pod), zone: rear, status: confirmed, pins: {pos: 12v, neg: 12v}}
  HEAD_L:
    name: Left headlight (stock, 12 V 35/35 W)
    zone: front
    status: from_manual
    note: "Dual filament bulb, low and high, one shared earth (Kawasaki 2013 Teryx 750 owner's manual: headlight 12 V 35/35 W x 2)"
    check: Unplug a headlight and photo the plug. Which pin is low, high and earth?
    pins: {LO: {v: 12v, multi: true}, HI: 12v, GND: gnd}
  HEAD_R: {name: "Right headlight (stock, 12 V 35/35 W)", zone: front, status: from_manual, pins: {LO: {v: 12v, multi: true}, HI: 12v, GND: gnd}}
  TAIL_L:
    name: Left tail / brake light (stock, 12 V 8/27 W)
    zone: rear
    status: from_manual
    note: "Dual filament bulb, 8 W tail and 27 W brake, one shared earth (owner's manual: tail/brake light 12 V 8/27 W x 2)"
    check: Photo the tail light plug. Which wire is tail, brake and earth?
    pins: {TAIL: {v: 12v, multi: true}, STOP: {v: 12v, multi: true}, GND: gnd}
  TAIL_R: {name: "Right tail / brake light (stock, 12 V 8/27 W)", zone: rear, status: from_manual, pins: {TAIL: {v: 12v, multi: true}, STOP: {v: 12v, multi: true}, GND: gnd}}
  LIMP_SW:
    name: Backup lights toggle (hidden)
    zone: cab
    status: planned
    note: "The Teryx has no headlight switch, so the dash and the Pico do everything. This hidden toggle is the backup if the control box dies: it feeds both low beams and both tails at full through diodes. Leave it off normally. The Pico also turns low beams and tails on by itself if the dash goes quiet with the key on"
    pins: {IN: 12v, OUT: {v: 12v, multi: true}}
  BEACON:
    name: Roof beacon (amber + white LED, steady-on)
    zone: rear
    status: planned
    note: "Sam's amber + white LED beacon (bought 18 Nov). Each colour stays on steady and the Pico flashes them at 3 Hz (NZ Vehicle Lighting Rule 11.1(2): 2 to 4 Hz), amber and white taking turns. White only when stopped: on the road only red or amber may show to the rear. Fits Sam's existing hole on the roof"
    check: "Count the wires. Common earth + one wire per colour is what this plan expects. If each colour has its own earth it still works (join the earths). If it has a mode wire instead (one + feed, cycles colours on a pulse), tell the dash thread"
    pins: {AMBER: 12v, WHITE: 12v, GND: gnd}

  # ---------------------------------------------------------- winch
  BRK_WINCH:
