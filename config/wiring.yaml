    status: planned
    note: "Manual reset breaker, also the winch's kill switch: push it off to make the winch dead. No isolator contactor (Sam, 18 Nov), so the XBull remote and hand switches work whenever this is on"
    pins: {in: 12v, out: 12v}
  WINCH_SOL:
    name: XBull solenoid box
    zone: front
    status: confirmed
    check: Photo the XBull solenoid box terminals and the remote plug pins
    pins: {B+: 12v, M1: 12v, M2: 12v, GND: gnd, COIL_IN: {v: 12v, multi: true}, COIL_OUT: {v: 12v, multi: true}, REMOTE: 12v}
  WINCH_MOTOR:
    name: XBull 5000 lb winch motor
    zone: front
    status: confirmed
    pins: {M1: 12v, M2: 12v}
  WINCH_REMOTE:
    name: XBull handheld remote
    zone: front
    status: confirmed
    pins: {PLUG: 12v}
  HSW_WINCH:
    name: Hidden winch switch (at the winch)
    zone: front
    status: confirmed
    note: Momentary (ON)-OFF-(ON)
    pins: {FEED: 12v, IN: {v: 12v, multi: true}, OUT: {v: 12v, multi: true}}
  HSW_CAB:
    name: Hidden winch switch (in the cab)
    zone: cab
    status: confirmed
    note: Momentary (ON)-OFF-(ON)
    pins: {FEED: 12v, IN: {v: 12v, multi: true}, OUT: {v: 12v, multi: true}}

  # ---------------------------------------------------------- drive
  ACT_DIFF:
