footnote:
  cn: 正常情况下，出厂的控制器均经过优化，性能达到最佳，第 0 页和 4 页的绿色标注的参数可以根据车辆的载重量进行适当修改，以获得最佳的客户体验和舒适度。
  cn_ours: Normally every controller is optimised at the factory for best performance. The green parameters on pages 0 and 4 can be adjusted to suit the vehicle's load, for the best experience and comfort.
  en: "Note: The default value(different controller has different default value) of controller is optimized and the peformance is the best normally, if you really want to adjust some value of parameter, please just adjust those parameters which is labeled green according to your electric vehicle with our permission in order to get the best user-experience. We don't suggest you to modify them without permission."
  note: The English adds "with our permission" and "different controller has different default value". The Chinese just says the green ones can be adjusted for load.
