footnote:
  cn: 正常情况下，出厂的控制器均经过优化，性能达到最佳，第 0 页和 4 页的绿色标注的参数可以根据车辆的载重量进行适当修改，以获得最佳的客户体验和舒适度。
  en: Normally every controller is optimised at the factory for best performance. The green parameters on pages 0 and 4 can be adjusted to suit the vehicle's load, for the best experience and comfort. Default
    values differ between controllers.
