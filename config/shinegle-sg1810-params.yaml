# Shinegle SG1810 programmer: parameter list (附表1 编程器参数), our copy.
# Taken from the SG1810 manual ("6_Programmer SG1810 Instruction English
# 20220415", screenshots from Sam, 2026-11-18). The Chinese is the source; the
# English is our own, corrected translation (Shinegle's English had errors).
#
# Fields: page, name, value (as printed, "for reference only"), adjustable
# (green in the manual: the only ones Shinegle allow changing), cn / en,
# remark_cn / remark, note. A field is left out when the cell was empty.
#
# Rendered to docs/shinegle-sg1810-tables.md by `python -m teryx shinegle-manual`.
# Edit this file, not the markdown. A test fails if they get out of step.

params:
- page: '0'
  name: F_Spd
  value: 8000-13800
  adjustable: true
  cn: 最大前进速度系数
  en: Max forward speed coefficient
  remark_cn: 已最优，无需调整，乘 0.5 为设定的最大速度 F_Spd :8000~16000
  remark: Already optimal, no need to adjust. Top speed = 0.5 x F_Spd. Range 8000-16000.
  note: The value column says 8000-13800. Green in the manual even though it says no need to adjust.
- page: '0'
  name: F_Spd2
  value: '5000'
  cn: 最大前进速度 2 系数
  en: Max forward speed 2 coefficient
  remark_cn: 特殊车辆用，乘 0.5 为设定速度
  remark: For special vehicles. Speed = 0.5 x F_Spd2.
- page: '0'
  name: R_Spd
  value: '6144'
  adjustable: true
  cn: 最大后退速度系数
  en: Max reverse speed coefficient
  remark_cn: '可适当调整，乘 0.5 为设定的最大速度 R_Spd: 6000~10000'
  remark: Can be adjusted to suit. Top reverse speed = 0.5 x R_Spd. Range 6000-10000.
  note: The manual photo of page 0 shows F_Spd 8300, R_Spd 3500 and Kf 300, so real controllers differ from this table.
- page: '0'
  name: Kf
  cn: 系统参数
  en: System parameter
  remark_cn: 内部数据，禁止修改
  remark: Internal data, do not change.
- page: '1'
  name: R_Trat2
  value: '24'
  cn: 后退电流 2 响应系数
  en: Reverse current 2 response coefficient
  remark_cn: 特殊车辆用
  remark: For special vehicles.
- page: '1'
  name: B_Trat2
  value: '24'
  cn: 制动电流 2 响应系数
  en: Braking current 2 response coefficient
  remark_cn: 特殊车辆用
  remark: For special vehicles.
- page: '1'
  name: F_Trat
  value: '64'
  cn: 前进电流响应系数
  en: Forward current response coefficient
  remark_cn: '已优化 , F_Trat: 24~72'
