# Shinegle SG1810 programmer: "Attached list 1 Parameters of programmer"
# (附表1 编程器参数), transcribed from Sam's screenshots of the SG1810 manual
# ("6_Programmer SG1810 Instruction English 20220415"), 2026-11-18.
#
# Fields:
#   page, name, value (as printed, "for reference only")
#   cn          the Chinese description exactly as printed
#   cn_ours     our own translation of the Chinese
#   en          Shinegle's English, as printed (typos kept)
#   remark_cn / remark_cn_ours / remark_en   same for the Remark column
#   adjustable  true = highlighted green in the manual (the only ones Shinegle
#               say may be changed, to suit the vehicle's load)
#   note        where the Chinese and English disagree, or something looks off
# A field is left out when the cell is empty. Nothing here is guessed: cells we
# couldn't read are marked "unreadable".
#
# Rendered to docs/shinegle-sg1810-tables.md by `python -m teryx shinegle-manual`.
# Edit this file, not the markdown. A test fails if they get out of step.

params:
  - page: "0"
    name: F_Spd
    value: "8000-13800"
    cn: 最大前进速度系数
    cn_ours: Max forward speed coefficient
    en: Coefficient for Max.forward speed
    remark_cn: 已最优，无需调整，乘 0.5 为设定的最大速度 F_Spd :8000~16000
    remark_cn_ours: "Already optimal, no need to adjust. x 0.5 = the set top speed. F_Spd: 8000-16000"
    remark_en: "Optimized,no change, Max.speed=0.5*F_Spd"
    adjustable: true
    note: Value column says 8000-13800 but the remark says 8000-16000. The English drops the range. Highlighted green (adjustable) even though the remark says no need to adjust.
  - page: "0"
    name: F_Spd2
    value: "5000"
    cn: 最大前进速度 2 系数
    cn_ours: Max forward speed 2 coefficient
    en: Coefficient for Max.forward speed2
    remark_cn: 特殊车辆用，乘 0.5 为设定速度
    remark_cn_ours: For special vehicles. x 0.5 = the set speed
    remark_en: "For special vechicle, Max.speed=0.5*F_Spd2"
  - page: "0"
    name: R_Spd
    value: "6144"
    cn: 最大后退速度系数
    cn_ours: Max reverse speed coefficient
    en: Coefficient for Max.backward speed
    remark_cn: "可适当调整，乘 0.5 为设定的最大速度 R_Spd: 6000~10000"
    remark_cn_ours: "Can be adjusted to suit. x 0.5 = the set top speed. R_Spd: 6000-10000"
    remark_en: "R_Spd: 6000~10000 Max.speed=0.5*R_Spd"
    adjustable: true
    note: The English leaves out "can be adjusted to suit". The Fig. 3 photo shows R_Spd 3500 (below the 6000 bottom of the range), F_Spd 8300 and Kf 300, so real units differ from the table.
  - page: "0"
    name: Kf
    cn: 系统参数
    cn_ours: System parameter
    en: system parameter
    remark_cn: 内部数据，禁止修改
    remark_cn_ours: Internal data, do not change
    remark_en: Internal data, Prohibition of modification
    note: No value printed.
  - page: "1"
