# Teryx OS: the parts list (bill of materials), machine readable.
#
#     python -m teryx bom           write the list (docs/pbtech-order.md block + .csv)
#     python -m teryx bom --check   only check it (what CI runs, via tests)
#
# Every device in config/wiring.yaml must be in exactly one place here:
#   a line's `covers`, `owned` (Sam has it), `kit` (comes with the Shinegle kit
#   or the stock Teryx) or `later` (not part of this build). A test fails if one
#   is missing, so a new part in the wiring can't be left off the list.
# Every `via:` in the wiring (diodes, resistors, dividers) must be in `via_parts`.
# Wire, CAN cable, fuses, fuse holders, lugs, ferrules and waterproof plugs are
# worked out from the wiring by teryx/bom.py, not typed in here.
#
# Prices are NZ$ incl GST. `source` says where each one came from. "Estimate"
# means I couldn't open a shop page for it (PB Tech and AliExpress block my
# requests), so check before paying.

version: 1

shops:
  pbtech:    {title: "PB Tech (buy Thursday)", order: 1}
  aliexpress: {title: "AliExpress (one order, 2 to 4 weeks)", order: 2}
  core:      {title: "Core Electronics (AU, online)", order: 3}
  nz_online: {title: "Gogo:Tronics and element14 (NZ, online)", order: 4}
  local:     {title: "Local: Jaycar, Narva stockist, Repco, auto electrical", order: 5}
  pickup:    {title: "Separate pickup", order: 6}

# One-way run length in metres between zones, along the frame, for the wire
# estimate. Same zone: 0.5 m. The generator adds 25% and rounds up to 5 m.
zone_m:
  cab-control_box: 1.0
  cab-dash: 1.0
  cab-engine_bay: 1.5
  cab-front: 2.0
  cab-hv: 1.5
  cab-rear: 2.0
  control_box-dash: 1.5
  control_box-engine_bay: 1.5
  control_box-front: 2.5
  control_box-hv: 1.5
  control_box-rear: 2.5
  dash-engine_bay: 1.5
  dash-front: 2.0
  dash-rear: 3.0
  engine_bay-front: 1.5
  engine_bay-hv: 1.0
  engine_bay-rear: 2.5
  front-front: 1.0
  rear-rear: 1.0
  rear-trailer: 0.5
  same: 0.5

# NZ$ per metre, auto cable (Jaycar / auto electrical, estimate).
wire_price_m: {0.5: 0.9, 0.75: 1.1, 1.0: 1.4, 1.5: 1.9, 2.5: 2.9, 4.0: 4.5, 6.0: 6.5, 10: 11.0, 35: 30.0}
can_cable_price_m: 2.5       # 2-core twisted, screened
speaker_cable_price_m: 1.5
blade_fuse_each: 1.5         # Narva standard blade
inline_holder_each: 6.0      # waterproof standard blade holder with lead
midi_fuse_each: 9.0
midi_holder_each: 22.0
lug_each: 2.0                # tinned copper lug, heatshrink
plug_pair: {2: 2.5, 3: 3.0, 4: 3.5, 6: 5.0}   # waterproof DT-style pair, AliExpress estimate

# What each `via:` in the wiring is made of. Counted up into one line.
via_parts:
  "3 A diode (1N5408)": {1N5408: 1}
  "1N4148": {1N4148: 1}
  "2 diodes + 1k to ground": {1N4148: 2, 1k resistor: 1}
  "divider 10k / 20k": {10k resistor: 1, 20k resistor: 1}
  "1 A diode": {1N4007: 1}
  "divider 10k / 2.2k + 3.3 V zener": {10k resistor: 1, 2.2k resistor: 1, 3.3 V zener: 1}
  "diode (backup)": {1N5408: 1}
  "opto board": {}            # the opto board line covers it

# Devices out in the weather that get a waterproof plug, so they unplug.
# The plug size comes from how many of their pins are wired.
plugs: [LB1, LB2, LB3, LB4, LB_INT, FLOOD_L, FLOOD_R, ACT_DIFF, ACT_4WD, ACT_TRAY,
        LIM_DN, LIM_UP, HSW_WINCH, CAM_REAR, CAM_TRAILER, IMU]

