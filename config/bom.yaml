  - {id: hdmi, shop: pbtech, part: Raspberry Pi micro HDMI to HDMI cable 1m, sku: SEVRBP0207, qty: 1, each: 11.80, source: Search result 18 Nov, notes: "Alt black SEVRBP0262 ~11.10", link: "https://www.pbtech.co.nz/product/SEVRBP0207"}
  - {id: sd, shop: pbtech, part: "Raspberry Pi A2 SD card 128GB (OS)", sku: SEVRBP0538, qty: 1, each: 47.32, source: "Search result 18 Nov", notes: "Official card, in the Pi's own slot. Not made for non-stop writes, so dashcam/Sentry recording stays off or minimal until extra storage is added", link: "https://www.pbtech.co.nz/product/SEVRBP0538"}
  - {id: dac_hat, shop: pbtech, part: "Raspberry Pi DAC+ HAT (ex IQaudio DAC+, SC0368)", sku: SEVRBP0313, qty: 1, each: 35.65, source: "Search result 18 Nov (out of stock when indexed)", covers: [DAC_HAT], notes: "Official board, RCA out. If PB Tech has none: Pakronics NZ ~NZ$40", link: "https://www.pbtech.co.nz/product/SEVRBP0313"}

  # ------------------------------------------------------------- AliExpress
  - {id: tcam_dongle, shop: aliexpress, part: "CVBS (PAL) to MIPI CSI-2 board, ADV728x-M, 3-4 video inputs", qty: 1, each: 120.00, source: "Estimate. AliExpress search: ADV7282 MIPI CSI (or ADV7280 CSI Raspberry Pi). No official Pi product does this", covers: [TCAM_DONGLE], notes: "Sam unsure if ordered: check your AliExpress orders first. Search: ADV7282 MIPI CSI Raspberry Pi (or ADV7280 CVBS to CSI2). Chip must be ADV7280-M, ADV7281-M or ADV7282-M (the -M is the ribbon output), at least 3 video inputs on plugs or pads (front, rear, trailer), 4 to add the cabin camera later. All the cameras go into this board now, so check the photos and count the inputs. Pi camera ribbon socket. Not TP28xx (no Pi driver) or HDMI-to-CSI. Bench test on the Pi 5"}

  # ------------------------------------------------------------- AliExpress top-up
  # 19 Nov: replaces the Core Electronics order (CAN, MCP23017, Pololu) and the
  # Gogo:Tronics / element14 bits, since the main AliExpress order had already gone.
  - {id: pi_buck, shop: ali_topup, part: "Waterproof DC-DC step-down converter, 12V/24V in, 5V 10A 50W out (finned aluminium case, wire leads)", qty: 1, each: 22.00, source: "Estimate, AliExpress", covers: [PI_BUCK], notes: "Search: DC DC converter 12V 24V to 5V 10A waterproof. The finned aluminium ones with wire leads are the right kind (potted means filled with resin inside that case). Listing must say input 8-40V or wider, 10A, and no USB plug. 5V or 5.2V out are both fine for the Pi 5. Powers the Pi + 4G board"}
  - {id: as5600, shop: ali_topup, part: "AS5600 magnetic angle sensor board, with its round magnet", qty: 1, each: 6.00, source: "Estimate, AliExpress", covers: [RC_ANGLE], notes: "Search: AS5600 magnetic encoder module. It's a small square board (about 23 x 23 mm) that reads the angle of a little round magnet spinning over its chip. The round thing in the photos is that magnet (6 mm across, 2.5 mm thick, magnetised across its face, called diametric), sometimes in a plastic holder. Get the plain board with the magnet. Skip the kits with a second board or bracket, you don't need them. If no magnet is included, add a 6x2.5mm diametric magnet. Only needed if the Aqua ECU doesn't send the angle"}
  - {id: lvl_shift, shop: ali_topup, part: "4-channel I2C logic level converter board, bi-directional, 3.3V to 5V, 5 pack", qty: 1, each: 4.00, source: "Estimate, AliExpress", covers: [RC_LVL], notes: "Search: 4 channel IIC I2C logic level converter bi-directional module 3.3V 5V. Small board with pins marked HV, LV, GND, HV1-4 and LV1-4. The chips on it are BSS138s, that's just the part inside, so don't search for the bare BSS138"}
  - {id: foam, shop: ali_topup, part: "Closed-cell EVA foam tape, single-sided sticky, 2mm thick x 10mm wide, black, 3-5m roll", qty: 1, each: 5.00, source: "Estimate, AliExpress", notes: "Seals the screen bezel to the dash panel (needs about 1 m round the cut-out). The bezel lip is about 28 mm, so 10 mm wide sits in the recess with room to spare"}
  - {id: loom, shop: ali_topup, part: "Split corrugated conduit (black ribbed tube with a slit), about 10mm and 16mm inside size, 10m each", qty: 1, each: 18.00, source: "Estimate, AliExpress", notes: "Yes, split conduit, not spiral wrap. It takes rubbing, mud and sun better and wires can be added later through the slit. Listings often give the outside size (AD13, AD21.2 etc), so pick by the inside size in the size chart. Nylon (PA) if you can, it handles heat better than PP near the motor"}
  - {id: heatshrink, shop: ali_topup, part: "Heatshrink, 3:1 glue-lined (adhesive), black kit: 1.6, 2.4, 3.2, 4.8, 6.4, 9.5, 12.7 and 19.1mm, plus a small red pack", qty: 1, each: 15.00, source: "Estimate, AliExpress", notes: "3.2mm for 0.5-1mm² joins, 4.8mm for 1.5-2.5mm², 6.4-9.5mm for 4-10mm², 19.1mm for the 35mm² lugs (that cable is about 12mm thick). Red for the + ends of the big cables"}
  - {id: smallparts, shop: ali_topup, part: "Diodes and resistors", qty: 1, each: 0, source: "Estimate, AliExpress", notes: "AUTO"}   # split into one line per part from via_buy
  - {id: busbar, shop: ali_topup, part: "Ground bus bar, 150A or more, M8 studs plus small screw terminals, with cover", qty: 1, each: 15.00, source: "Estimate, AliExpress", covers: [GND_STAR], notes: "About 25 earths land here, the biggest is the 10mm² battery negative, and the total is well under 100 A. A bar with 2-4 M8 studs plus 8-12 small screw terminals saves stacking lots of rings on a stud. The winch earth goes straight to the battery, not here"}
  - {id: rca, shop: ali_topup, part: "RCA stereo lead 3m (one cable, 2 plugs each end)", qty: 1, each: 8.00, source: "Estimate, AliExpress", notes: "One lead is all you need: it's the left + right pair in one cable, DAC HAT to the amp. If the amp has a 2CH/4CH input switch set it to 2CH so the sub channels get signal too, if not add a pair of RCA Y splitters (1 male to 2 female)"}
  - {id: hsw, shop: ali_topup, part: "Heavy duty momentary toggle switch, (ON)-OFF-(ON), SPDT 3 terminals, 20A 12V DC, 12mm hole, with waterproof rubber boot", qty: 2, each: 8.00, source: "Estimate, AliExpress", covers: [HSW_WINCH, HSW_CAB], notes: "Search: 12V 20A momentary toggle switch ON-OFF-ON 3 pin, and pick one where both sides spring back to the middle (shown as (ON)-OFF-(ON) or momentary on both sides). Hidden winch in/out switches, one at the winch and one in the cab. They work the solenoid coil (5 A fuse), so 20A is plenty. Get boots that match the thread (usually 12mm)"}

  # ------------------------------------------------------------- local
  - {id: narva_7pin, shop: local, part: Narva 7-pin flat socket with reed switch, sku: 82043BL, qty: 1, each: 35.00, source: Estimate, covers: [TRAILER], link: "https://narva.com.au/products/narva-7-pin-flat-quickfit-trailer-socket-with-reed-switch-for-use-with-normally-closed-circuits-1-pack", notes: "NZ/AU flat 7-pin trailer socket with the reed switch that tells the dash a trailer is plugged in. Narva stockist (Repco, auto electrical)"}
  - {id: fnr, shop: local, part: "F-N-R switch: DPDT centre-off toggle, ON-OFF-ON, 6 terminals, 15A, with rubber boot", qty: 1, each: 20.00, source: Estimate, covers: [FNR], notes: "Forward / neutral / reverse, straight to the Shinegle controller. Not momentary: it must stay where you put it. Jaycar or Narva stockist. It only carries a small signal, but check the controller's F/R wire voltage first (it might be 72 V, see the wiring notes)"}
  - {id: estop, shop: local, part: "E-stop button: 22mm panel mount, 40mm red mushroom, twist to release, 1 NC contact (e.g. Schneider XB5AS8442 or XB4BS8442)", qty: 1, each: 25.00, source: Estimate, covers: [ESTOP], notes: "RC mode only: cuts the Shinegle key line (KSI) with no software. NC means the contact opens when you hit it. Electrical wholesaler (Corys, JA Russell) or Jaycar. Needs a 22mm hole"}
  - {id: sim, shop: local, part: "Prepaid SIM with 4G on 700MHz (band 28): Spark, One NZ or 2degrees", qty: 1, each: 10.00, source: Estimate, notes: "For the A7670SA 4G board: SMS commands and light data. Any of the three works; cheapest yearly top-up wins"}
  - {id: wago, shop: local, part: "Wago 221-415 lever connectors (5-way, up to 4mm², 32A), pack of 10+", qty: 1, each: 20.00, source: Estimate, covers: [RAIL], notes: "Dash 12V rail splits. Genuine Wago from an electrical wholesaler, Bunnings or Mitre 10; lots of fakes online"}
  - {id: limp_sw, shop: local, part: "Backup lights switch: SPST ON-OFF toggle, 20A at 12V DC, 12mm hole, with waterproof rubber boot", qty: 1, each: 12.00, source: Estimate, covers: [LIMP_SW], notes: "Hidden. Carries both low beams, tails and trailer tails at full (about 8 A) if the control box dies. Not momentary. Narva stockist or Jaycar"}
  - {id: grease, shop: local, part: "Dielectric grease, small tube (CRC or Permatex)", qty: 1, each: 12.00, source: Estimate, notes: "Repco or Supercheap. A smear in the trailer plugs and outdoor plugs before joining"}
  - {id: asa, shop: local, part: "ASA filament 1.75mm 1kg (dash panel, hood, back plate, speaker pods and their T. rex heads)", qty: 7, each: 45.00, source: Estimate, notes: "Bambu ASA or similar, stone grey or olive. The two heads and jaws take about 1.6 kg at 10-15% infill. Leave out what you already have"}
  - {id: asa_colours, shop: local, part: "ASA filament 1.75mm, small spools: bone/off-white, amber/orange, black (T. rex teeth, eyes, pupils)", qty: 3, each: 45.00, source: Estimate, notes: "Only about 60 g of each is used. Leave out what you already have"}
  - {id: pod_fill, shop: local, part: "Polyester fibre fill (speaker wadding or pillow stuffing), 200 g", qty: 1, each: 12.00, source: Estimate, notes: "Kmart or Spotlight pillow stuffing is fine. About 70 g per speaker pod, loose. Not foam (it holds water)"}
  - {id: petg, shop: local, part: "PETG filament 1.75mm 1kg (boxes, liner)", qty: 1, each: 35.00, source: Estimate, notes: "Bambu PETG or similar, any colour (inside the boxes)"}
  - {id: alu_cut, shop: local, part: "3mm aluminium cut from DXF: back plate + Pi lid plate", qty: 1, each: 80.00, source: Estimate, notes: "Laser or waterjet shop; send them the DXF files in cad/stl/*.dxf. 3mm 5052 or 5083 aluminium"}

