  - {id: pi5, shop: pbtech, part: Raspberry Pi 5 8GB, sku: SEVRBP0502, qty: 1, each: 371.39, source: Checked 17 Nov, covers: [PI5], notes: "On order, ships about 30 Nov; ask in store", link: "https://www.pbtech.co.nz/product/SEVRBP0502"}
  - {id: cam_cable, shop: pbtech, part: Pi 5 camera cable 200mm, sku: SEVRBP0541, qty: 1, each: 2.12, source: Search result 18 Nov, notes: "Video board to the Pi 5 (the Pi 5 has the small 22-pin socket; skip it if the board comes with a Pi 5 cable). Only one now: the Pi Camera Module 3 is dropped", link: "https://www.pbtech.com/pacific/product/SEVRBP0541"}
