# Teryx dash OS: machine-readable IO map (draft v0.1)
# Human version: docs/io-list.md. Keep both in step.
# Used by the simulator, the dash UI and the Pico firmware.

version: 0.1

can:
  bitrate: 250000          # TBC: match the Shinegle
  ids:
    pi_heartbeat:   0x700  # Pi -> Pico, 10 Hz
    pi_lights:      0x701  # Pi -> Pico, on change
    pi_drive:       0x702  # Pi -> Pico, on change
    pi_hold_to_run: 0x703  # Pi -> Pico, 10 Hz while held
    pi_settings:    0x704  # Pi -> Pico, on change
    pi_lock:        0x705  # Pi -> Pico, on demand
    pi_lights2:     0x706  # Pi -> Pico, on change (stock lamps, floods, beacon, trailer, light show)
    pico_status:    0x710  # Pico -> Pi, 10 Hz
    pico_outputs:   0x711  # Pico -> Pi, 10 Hz
    pico_actuators: 0x712  # Pico -> Pi, 10 Hz
    pico_power:     0x713  # Pico -> Pi, 1 Hz
    pico_lights2:   0x717  # Pico -> Pi, 10 Hz
    pi_fw_update:   0x71F  # Pi -> Pico, on demand

outputs:
  light.front_1:   {driver: mosfet, pin: GP16, pwm: true, fuse_a: 10, label: "Front bar 1 (top)"}
  light.front_2:   {driver: mosfet, pin: GP17, pwm: true, fuse_a: 10, label: "Front bar 2 (2nd down)"}
  light.front_3:   {driver: mosfet, pin: GP18, pwm: true, fuse_a: 10, label: "Front bar 3 (3rd down)"}
  light.front_4:   {driver: mosfet, pin: GP19, pwm: true, fuse_a: 10, label: "Front bar 4 (bottom)"}
  light.interior:  {driver: mosfet, pin: GP20, pwm: true, fuse_a: 5,  label: "Interior bar"}
  light.rear:      {driver: relay, relay: 1, expander_pin: A0, fuse_a: 15, label: "Trailer reverse pin (follows the rear floods)"}
  # Everything below dims through the PCA9685 (0x40) on the Pico's I2C. docs/lights.md
  # The stock lamps are high side on BTS7960 4-8 and the beacon on 9 (RPWM = M+, LPWM = M-); the rest are MOSFET channels.
  light.trailer_bar:  {driver: pca9685, channel: 0,  to: [MOSFET.IN6], label: "Trailer light bar"}
  light.head_l_low:   {driver: pca9685, channel: 1,  to: [BTS4.RPWM], fuse_a: 10, label: "Left headlight low"}
  light.head_l_high:  {driver: pca9685, channel: 2,  to: [BTS4.LPWM], fuse_a: 10, label: "Left headlight high"}
  light.head_r_low:   {driver: pca9685, channel: 3,  to: [BTS5.RPWM], fuse_a: 10, label: "Right headlight low"}
  light.head_r_high:  {driver: pca9685, channel: 4,  to: [BTS5.LPWM], fuse_a: 10, label: "Right headlight high"}
  light.tail_l:       {driver: pca9685, channel: 5,  to: [BTS6.RPWM], fuse_a: 10, label: "Left tail"}
  light.brake_l:      {driver: pca9685, channel: 6,  to: [BTS6.LPWM], fuse_a: 10, label: "Left brake (always full when braking)"}
  light.tail_r:       {driver: pca9685, channel: 7,  to: [BTS7.RPWM], fuse_a: 10, label: "Right tail"}
  light.brake_r:      {driver: pca9685, channel: 8,  to: [BTS7.LPWM], fuse_a: 10, label: "Right brake (always full when braking)"}
  light.trailer_tail: {driver: pca9685, channel: 9,  to: [BTS8.RPWM], fuse_a: 7.5, label: "Trailer tail"}
  light.trailer_stop: {driver: pca9685, channel: 10, to: [BTS8.LPWM], fuse_a: 7.5, label: "Trailer stop (always full when braking)"}
  light.flood_l:      {driver: pca9685, channel: 11, to: [MOSFET.IN7], fuse_a: 15, label: "Rear flood left"}
  light.flood_r:      {driver: pca9685, channel: 12, to: [MOSFET.IN8], fuse_a: 15, label: "Rear flood right"}
  light.beacon:       {driver: pca9685, channel: 13, to: [BTS9.RPWM], fuse_a: 5, label: "Roof beacon amber (Pico flashes it at 3 Hz)"}
  light.beacon_white: {driver: pca9685, channel: 14, to: [BTS9.LPWM], fuse_a: 5, label: "Roof beacon white (3 Hz, opposite amber, only when stopped)"}
  light.enable:       {driver: pca9685, channel: 15, to: [BTS4.EN, BTS5.EN, BTS6.EN, BTS7.EN, BTS8.EN, BTS9.EN], label: "BTS7960 4-9 enable"}
  winch.in:        {driver: relay, relay: 4, expander_pin: A3, fuse_a: 5,  label: "Winch in (solenoid coil)"}
  winch.out:       {driver: relay, relay: 5, expander_pin: A4, fuse_a: 5,  label: "Winch out (solenoid coil)"}
  aux.accessory:   {driver: relay, relay: 7, expander_pin: A6, fuse_a: 10, label: "Accessory 12V"}
  power.hold:      {driver: relay, relay: 8, expander_pin: A7, fuse_a: 7.5, label: "Power hold"}
  act.diff:        {driver: bts7960, unit: 1, pins: {rpwm: GP7,  lpwm: GP8,  en: GP9},  feedback: an.diff_pos, current: an.diff_current, fuse_a: 10, label: "Front diff lock"}
  act.4wd:         {driver: bts7960, unit: 2, pins: {rpwm: GP10, lpwm: GP11, en: GP12}, feedback: none, current: an.4wd_current, fuse_a: 10, label: "2WD / 4WD"}
  act.tray:        {driver: bts7960, unit: 3, pins: {rpwm: GP13, lpwm: GP14, en: GP15}, feedback: [in.tray_down, in.tray_up], current: an.tray_current, fuse_a: 15, label: "Tray lift"}

inputs:
  digital:
    in.ignition:     {expander_pin: B0, label: "Key on"}
    in.brake:        {expander_pin: B1, label: "Brake"}
    in.reverse:      {expander_pin: B2, label: "Reverse"}
    in.tray_down:    {expander_pin: B3, normally_closed: true, label: "Tray down limit"}
    in.tray_up:      {expander_pin: B4, normally_closed: true, label: "Tray up limit"}
    in.winch_remote: {expander_pin: B5, label: "Winch remote in use"}
    in.park:         {expander_pin: B6, label: "Parking brake pedal (stock switch)"}
    in.trailer:      {expander: 2, expander_pin: B0, opto: 8, label: "Trailer plugged in (reed switch in the 7-pin socket). On the 2nd MCP23017: GPB7 is output only on newer chips"}
  analogue:
    an.diff_pos:       {adc: ads1115, channel: 0, units: "%", calibrate: true}
    an.aux_12v:        {adc: ads1115, channel: 1, units: V, divider: [10000, 2200]}
    an.4wd_current:    {adc: ads1115, channel: 2, units: A}
    an.tray_current:   {adc: ads1115, channel: 3, units: A}
    an.diff_current:   {adc: pico, pin: GP28, units: A}
  motor_controller:    # Shinegle over CAN, IDs and scaling TBC after sniffing
    mc.speed:      {units: km/h, range: [0, 80]}
    mc.batt_v:     {units: V, range: [60, 84]}
    mc.batt_a:     {units: A, range: [-100, 400]}
    mc.soc:        {units: "%", range: [0, 100]}
    mc.motor_temp: {units: C, range: [-10, 150]}
    mc.ctrl_temp:  {units: C, range: [-10, 100]}
    mc.throttle:   {units: "%", range: [0, 100]}
    mc.throttle_sw: {units: bool, optional: true, note: "Throttle micro switch (SG1810 PedalSW). If we get it, the dash uses it for throttle at rest"}
    mc.regen:      {units: bool, optional: true, note: "Only if the Shinegle sends its own regen flag. Without it the dash works regen out itself (dash/web/js/regen.js)"}
    mc.direction:  {enum: [forward, neutral, reverse]}
    mc.mode:       {enum: [eco, normal, sport]}
    mc.faults:     {bitfield: 16}

can_layout:
  resend_state_s: 1          # 0x701/0x702 also resent every 1 s
  pico_state: [boot, ok, degraded, failsafe]   # 0x710 b4
  fault_bits:                # 0x710 b1-2 (u16)
    0: dash_link
    1: speed_unknown
    2: fourwd_timeout
    3: fourwd_overcurrent
    4: diff_timeout
    5: diff_pot_stuck
    6: tray_timeout
    7: tray_overcurrent
    8: tray_limit_switch
    9: winch_interlock
    10: low_12v
    11: pico_hot
    12: watchdog_reset

safety:                      # defaults, adjustable in settings
  heartbeat_timeout_ms: 500
  speed_timeout_ms: 500
  hold_to_run_timeout_ms: 300
  fourwd_max_kmh: 1           # Kawasaki: stop before changing 2WD/4WD (docs/teryx-drivetrain.md)
  fourwd_max_run_s: 3
  fourwd_overcurrent_a: 6
  diff_max_kmh: 15            # adding lock only; unlocking is allowed at any speed
  diff_max_run_s: 4
  shift_wait_s: 10            # a 4WD / diff request waits this long for the right speed, then gives up (0 = refuse at once)
  shift_throttle_hold: true   # hold throttle while a shift runs from a standstill (never while moving)
  park_interlock: true        # no drive while the park brake is on: relay 6 opens the pedal switch (docs/park-brake.md)
  sentry_min_12v: 12.2        # key off: sentry keeps the Pi on only while the 12V battery is above this (docs/sentry.md)
  tray_requires_stopped: true
  tray_max_run_s: 20
  tray_overcurrent_a: 10
  winch_requires_stopped: true
  winch_requires_armed: true
  winch_dead_time_ms: 100
  winch_auto_disarm_s: 120
  winch_timed_max_s: 30
  shutdown_wait_s: 30
