<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Teryx</title>
<style>
  :root { --bg:#0b0d0f; --card:rgba(21,25,29,.82); --line:#262c32; --text:#e8ecef; --dim:#7d8891; --accent:#ff7a1a; --ok:#3ccf6e; --warn:#ffc23d; --bad:#ff4d4d; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  .hud { position:fixed; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; backdrop-filter:blur(4px); }
  .speed { font-size:40px; font-weight:200; line-height:1; font-variant-numeric:tabular-nums; }
  .speed small { font-size:13px; color:var(--dim); margin-left:4px; }
  .grid { display:grid; grid-template-columns:auto auto; gap:2px 12px; font-size:13px; }
  .grid span:nth-child(odd) { color:var(--dim); }
  .tags { display:flex; flex-wrap:wrap; gap:4px; max-width:260px; }
  .tag { font-size:11px; padding:2px 7px; border-radius:5px; background:#20262c; color:var(--dim); letter-spacing:.06em; }
  .tag.on { background:var(--accent); color:#000; }
  .tag.warn { background:var(--warn); color:#000; }
  .tag.bad { background:var(--bad); color:#fff; }
  .tools { position:fixed; top:10px; right:10px; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; max-width:60vw; }
  button { font:inherit; font-size:12px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.on { background:var(--accent); color:#000; border-color:var(--accent); }
  .note { position:fixed; bottom:8px; left:10px; font-size:11px; color:var(--dim); }
  #offline[hidden] { display:none; }
  #offline { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--warn); pointer-events:none; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="view"></div>
<div class="hud">
  <div class="card"><div class="speed"><span id="spd">0</span><small>km/h</small> <b id="dir" style="font-size:20px;color:var(--accent)">N</b></div></div>
  <div class="card grid">
    <span>Drive</span><b id="fw">--</b>
    <span>Diff lock</span><b id="diff">--</b>
    <span>Tray</span><b id="tray">--</b>
    <span>Winch</span><b id="winch">--</b>
    <span>Battery</span><b id="soc">--</b>
    <span>Power</span><b id="pow">--</b>
  </div>
  <div class="card tags" id="tags"></div>
</div>
<div class="tools">
  <button data-cam="front">Front</button><button data-cam="side">Side</button>
  <button data-cam="rear">Rear</button><button data-cam="top">Top</button>
  <button id="follow" class="on">Follow</button>
  <button id="xray">See-through</button>
  <button id="night">Night</button>
  <button id="paint">Paint</button>
</div>
<div id="offline" hidden>Waiting for the dash feed...</div>
<div class="note">Drag to orbit, scroll to zoom. 2013 Teryx 750 built to the real sizes, driven by the live CAN state. <span id="fps"></span></div>
<script src="/common/teryx.js"></script>
<script type="module" src="/virtual-static/virtual.js"></script>
</body>
</html>
