<text x="740" y="94" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Unknown</text>
<text x="40" y="112" font-size="12" text-anchor="start" font-weight="bold" fill="#cf222e">Programmer lead carries +12 V on J1-25: never plug it into a USB port.</text>
