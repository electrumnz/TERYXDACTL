<text x="40" y="40" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2328">Shinegle SG1202 wiring (Teryx OS redraw)</text>
<text x="40" y="62" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">Source: Shinegle SG12X2 manual, Fig. 2 and 3. Data: config/shinegle-sg1202.yaml</text>
<line x1="40" y1="90" x2="74" y2="90" stroke="#1f6feb" stroke-width="2"/>
<text x="80" y="94" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">From the manual</text>
<line x1="260" y1="90" x2="294" y2="90" stroke="#1a7f37" stroke-width="2"/>
<text x="300" y="94" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Measured on the Teryx</text>
<line x1="480" y1="90" x2="514" y2="90" stroke="#bf8700" stroke-width="2" stroke-dasharray="6 4"/>
<text x="520" y="94" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Expected, pin TBC</text>
