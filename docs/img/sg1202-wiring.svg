<text x="600.0" y="188" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">56-80 V, 400 A max</text>
<text x="600.0" y="598" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a">J1: AMP 35-way 776163-1</text>
