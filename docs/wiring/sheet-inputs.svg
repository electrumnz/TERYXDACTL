<g data-wire="I01" data-from="KEY.IGN" data-to="OPTO.IN1" data-status="planned"><title>I01: KEY.IGN -&gt; OPTO.IN1 - So the Pico sees key-off while relay 8 holds the rail. 0.75 mm² because the 7.5 A key fuse is upstream</title><path d="M480,197 C395,197 395,197 310,197" fill="none" stroke="#424a53" stroke-width="1.4"/></g>
