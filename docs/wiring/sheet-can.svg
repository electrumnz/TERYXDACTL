<g data-device="EPS_CAN" data-status="planned"><title>EPS_CAN: MCP2515 CAN module (steering bus) - Own 500 kbit/s bus to the steering ECU. Transmit only, INT not wired</title><rect x="40" y="261" width="270" height="89" rx="6" fill="#f6f1ff" stroke="#424a53" stroke-width="1.5"/>
<text x="50" y="279" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2328">MCP2515 CAN module (steering bus)</text>
