<g data-device="PICO_CAN" data-status="planned"><title>PICO_CAN: MCP2515 CAN module (control box) - Blue AliExpress MCP2515 board (8 MHz crystal) with its 5 V TJA1050 swapped for a 3.3 V SN65HVD230 (same pins), so the whole board runs on 3.3 V. Never fit one with the TJA1050 still on: it puts 5 V on the Pico pins</title><rect x="480" y="150" width="270" height="89" rx="6" fill="#f6f1ff" stroke="#424a53" stroke-width="1.5"/>
