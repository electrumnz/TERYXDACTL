<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 583" width="1320" height="583" font-family="Arial, Helvetica, sans-serif" data-sheet="hv">
<rect width="1320" height="583" fill="#ffffff"/>
<text x="40" y="40" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2328">Traction: 72 V pack, controller, motor, DC-DC</text>
<text x="40" y="62" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">Teryx OS wiring, sheet &#x27;hv&#x27;. Made from config/wiring.yaml by `python -m teryx wiring`. Don&#x27;t edit this file.</text>
<line x1="40" y1="92" x2="74" y2="92" stroke="#1a7f37" stroke-width="2.5"/>
<text x="80" y="96" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Measured on the Teryx</text>
<line x1="250" y1="92" x2="284" y2="92" stroke="#0969da" stroke-width="2.5"/>
<text x="290" y="96" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Manual / confirmed</text>
<line x1="460" y1="92" x2="494" y2="92" stroke="#424a53" stroke-width="2.5"/>
<text x="500" y="96" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Our design, not built yet</text>
<line x1="670" y1="92" x2="704" y2="92" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="710" y="96" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">TBC: needs checking</text>
<line x1="880" y1="92" x2="914" y2="92" stroke="#8250df" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="920" y="96" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Placeholder / later</text>
<text x="40" y="120" font-size="11" text-anchor="start" font-weight="normal" fill="#57606a">Labels: wire id, size, fuse (if the wire has its own), and anything in between. Faded = optional. Hover for notes. Full table: docs/wiring/README.md</text>
<g data-wire="H01" data-from="PACK.pos" data-to="HV_ISO.in" data-status="from_manual"><title>H01: PACK.pos -&gt; HV_ISO.in - Main pack + to the air-break switch. Size TBC, check for a main HV fuse</title><path d="M310,197 C395,197 395,197 480,197" fill="none" stroke="#0969da" stroke-width="4.5"/></g>
<g data-wire="H02" data-from="HV_ISO.out" data-to="CONTACTOR.in" data-status="tbc"><title>H02: HV_ISO.out -&gt; CONTACTOR.in</title><path d="M750,217 C835,217 835,197 920,197" fill="none" stroke="#bf8700" stroke-width="4.5" stroke-dasharray="7 4"/></g>
<g data-wire="H03" data-from="CONTACTOR.out" data-to="SG1202.B+" data-status="tbc"><title>H03: CONTACTOR.out -&gt; SG1202.B+</title><path d="M920,217 C835,217 835,308 750,308" fill="none" stroke="#bf8700" stroke-width="4.5" stroke-dasharray="7 4"/></g>
<g data-wire="H04" data-from="PACK.neg" data-to="SG1202.B-" data-status="from_manual"><title>H04: PACK.neg -&gt; SG1202.B-</title><path d="M310,217 C395,217 395,328 480,328" fill="none" stroke="#0969da" stroke-width="4.5"/></g>
<g data-wire="H05" data-from="SG1202.U" data-to="MOTOR.U" data-status="from_manual"><title>H05: SG1202.U -&gt; MOTOR.U</title><path d="M750,348 C835,348 835,308 920,308" fill="none" stroke="#0969da" stroke-width="4.5"/></g>
<g data-wire="H06" data-from="SG1202.V" data-to="MOTOR.V" data-status="from_manual"><title>H06: SG1202.V -&gt; MOTOR.V</title><path d="M750,368 C835,368 835,328 920,328" fill="none" stroke="#0969da" stroke-width="4.5"/></g>
<g data-wire="H07" data-from="SG1202.W" data-to="MOTOR.W" data-status="from_manual"><title>H07: SG1202.W -&gt; MOTOR.W</title><path d="M750,388 C835,388 835,348 920,348" fill="none" stroke="#0969da" stroke-width="4.5"/></g>
<g data-wire="H08" data-from="CONTACTOR.out" data-to="DCDC.in_pos" data-status="tbc"><title>H08: CONTACTOR.out -&gt; DCDC.in_pos - Where the DC-DC takes its 72 V from is TBC</title><path d="M920,217 C835,217 835,479 750,479" fill="none" stroke="#bf8700" stroke-width="4.5" stroke-dasharray="7 4"/></g>
<g data-wire="H09" data-from="PACK.neg" data-to="DCDC.in_neg" data-status="tbc"><title>H09: PACK.neg -&gt; DCDC.in_neg</title><path d="M310,217 C395,217 395,499 480,499" fill="none" stroke="#bf8700" stroke-width="4.5" stroke-dasharray="7 4"/></g>
<g data-device="PACK" data-status="tbc"><title>PACK: Traction battery pack - 72 V. Size TBC (the range maths assumes 7.5 kWh)</title><rect x="40" y="150" width="270" height="89" rx="6" fill="#fff1f0" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="7 4"/>
